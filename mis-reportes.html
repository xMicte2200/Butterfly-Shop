<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Mis reportes — Butterfly Shop</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(
        135deg,
        #f7ecff,
        #fff5fb
      );
      color: #4b3158;
    }

    header {
      background: linear-gradient(
        135deg,
        #b77bd4,
        #e7a8d8
      );
      color: white;
      padding: 25px 20px;
      text-align: center;
      box-shadow: 0 4px 15px rgba(120, 70, 150, 0.2);
    }

    header h1 {
      margin: 0;
      font-size: 28px;
    }

    header p {
      margin: 8px 0 0;
      opacity: 0.95;
    }

    .loading {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      color: #8b5aa8;
    }

    #contenido {
      display: none;
    }

    .container {
      max-width: 1000px;
      margin: auto;
      padding: 25px 18px 40px;
    }

    .top-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 25px;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-block;
      border: none;
      border-radius: 12px;
      padding: 11px 17px;
      background: #b66bd0;
      color: white;
      text-decoration: none;
      cursor: pointer;
      font-size: 14px;
    }

    .btn:hover {
      background: #9d54bb;
    }

    .btn-secondary {
      background: #ead9f0;
      color: #744d83;
    }

    .btn-secondary:hover {
      background: #dcc4e5;
    }

    .intro {
      background: white;
      border-radius: 20px;
      padding: 22px;
      margin-bottom: 22px;
      box-shadow: 0 5px 20px rgba(150, 100, 170, 0.12);
    }

    .intro h2 {
      margin-top: 0;
      color: #9a5bb5;
    }

    .intro p {
      margin-bottom: 0;
      color: #80668b;
      line-height: 1.5;
    }

    .reportes {
      display: grid;
      gap: 20px;
    }

    .reporte {
      background: white;
      border-radius: 20px;
      padding: 22px;
      box-shadow: 0 5px 20px rgba(150, 100, 170, 0.12);
      border: 1px solid #ead9f0;
    }

    .reporte-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 15px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }

    .reporte-header h3 {
      margin: 0;
      color: #914faf;
    }

    .fecha-reporte {
      color: #927e99;
      font-size: 13px;
    }

    .estado {
      display: inline-block;
      padding: 8px 13px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: bold;
      white-space: nowrap;
    }

    .estado-pendiente {
      background: #fff0c9;
      color: #9a6b00;
    }

    .estado-revision {
      background: #eee1ff;
      color: #7546a0;
    }

    .estado-solucionado {
      background: #ddf7e7;
      color: #287548;
    }

    .datos {
      display: grid;
      grid-template-columns:
        repeat(auto-fit, minmax(220px, 1fr));
      gap: 13px;
      margin-bottom: 18px;
    }

    .dato {
      background: #fffaff;
      border-radius: 12px;
      padding: 13px;
      border: 1px solid #f0e4f3;
    }

    .dato strong {
      display: block;
      color: #8f5aa5;
      font-size: 13px;
      margin-bottom: 5px;
    }

    .dato span {
      color: #5c4863;
      word-break: break-word;
    }

    .bloque {
      background: #fffaff;
      border-radius: 14px;
      padding: 15px;
      margin-top: 14px;
      border: 1px solid #f0e4f3;
    }

    .bloque strong {
      display: block;
      color: #8f5aa5;
      margin-bottom: 8px;
    }

    .bloque p {
      margin: 0;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .solucion {
      background: #f1fff6;
      border: 1px solid #d8f0e1;
    }

    .solucion strong {
      color: #287548;
    }

    .empty {
      background: white;
      border-radius: 20px;
      padding: 45px 20px;
      text-align: center;
      box-shadow: 0 5px 20px rgba(150, 100, 170, 0.12);
    }

    .empty .icon {
      font-size: 48px;
      margin-bottom: 12px;
    }

    .empty h2 {
      margin: 0 0 8px;
      color: #9a5bb5;
    }

    .empty p {
      color: #80668b;
      margin: 0;
    }

    .error {
      background: #ffe7ee;
      color: #a33b5d;
      border-radius: 14px;
      padding: 18px;
      text-align: center;
    }

    .footer-actions {
      text-align: center;
      margin-top: 30px;
    }

  </style>
</head>

<body>

  <div id="loading" class="loading">
    🦋 Cargando tus reportes...
  </div>


  <div id="contenido">

    <header>

      <h1>🦋 Mis reportes</h1>

      <p>
        Consulta el estado de los reportes que has enviado
      </p>

    </header>


    <main class="container">

      <div class="top-actions">

        <a
          href="panel.html"
          class="btn btn-secondary"
        >
          ← Volver a mi panel
        </a>

        <button
          type="button"
          class="btn"
          onclick="cargarReportes()"
        >
          🔄 Actualizar
        </button>

      </div>


      <section class="intro">

        <h2>
          📋 Historial de reportes
        </h2>

        <p>
          Aquí puedes consultar los reportes que has realizado
          y revisar si están pendientes, en revisión o solucionados.
        </p>

      </section>


      <div id="reportes-container" class="reportes"></div>

    </main>

  </div>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>


  <script>

    async function verificarUsuario() {

      try {

        const {
          data: {
            user
          }
        } = await supabaseClient.auth.getUser();


        if (!user) {

          window.location.href = "login.html";

          return;

        }


        document
          .getElementById("loading")
          .style.display = "none";


        document
          .getElementById("contenido")
          .style.display = "block";


        await cargarReportes();

      } catch (error) {

        console.error(
          "Error verificando usuario:",
          error
        );

        document
          .getElementById("loading")
          .textContent =
          "❌ No se pudo cargar la página.";

      }

    }


    function obtenerClaseEstado(
      estado
    ) {

      if (
        estado === "En revisión"
      ) {

        return "estado-revision";

      }

      if (
        estado === "Solucionado"
      ) {

        return "estado-solucionado";

      }

      return "estado-pendiente";

    }


    function obtenerIconoEstado(
      estado
    ) {

      if (
        estado === "En revisión"
      ) {

        return "🟣";

      }

      if (
        estado === "Solucionado"
      ) {

        return "🟢";

      }

      return "🟡";

    }


    function formatearFecha(
      fecha
    ) {

      if (!fecha) {

        return "No disponible";

      }

      return new Date(
        fecha
      ).toLocaleDateString(
        "es-MX",
        {
          day: "2-digit",
          month: "2-digit",
          year: "numeric"
        }
      );

    }


    function formatearFechaHora(
      fecha
    ) {

      if (!fecha) {

        return "No disponible";

      }

      return new Date(
        fecha
      ).toLocaleString(
        "es-MX",
        {
          day: "2-digit",
          month: "2-digit",
          year: "numeric",
          hour: "2-digit",
          minute: "2-digit"
        }
      );

    }


    function escaparHTML(
      texto
    ) {

      if (
        texto === null ||
        texto === undefined
      ) {

        return "";

      }

      return String(texto)
        .replace(
          /&/g,
          "&amp;"
        )
        .replace(
          /</g,
          "&lt;"
        )
        .replace(
          />/g,
          "&gt;"
        )
        .replace(
          /"/g,
          "&quot;"
        )
        .replace(
          /'/g,
          "&#039;"
        );

    }


    async function cargarReportes() {

      const container =
        document.getElementById(
          "reportes-container"
        );


      container.innerHTML = `
        <div class="empty">
          <div class="icon">🦋</div>
          <h2>Cargando...</h2>
          <p>Estamos buscando tus reportes.</p>
        </div>
      `;


      try {

        const {
          data: {
            user
          }
        } =
          await supabaseClient.auth.getUser();


        if (!user) {

          window.location.href =
            "login.html";

          return;

        }


        const {
          data: reportes,
          error
        } =
          await supabaseClient
            .from("reports")
            .select(
              `
                id,
                platform,
                purchase_email,
                purchase_date,
                problem_type,
                description,
                status,
                created_at,
                resolved_at,
                account_type,
                admin_notes
              `
            )
            .eq(
              "user_id",
              user.id
            )
            .order(
              "created_at",
              {
                ascending: false
              }
            );


        if (error) {

          console.error(
            "Error cargando reportes:",
            error
          );

          container.innerHTML = `
            <div class="error">
              ❌ No se pudieron cargar tus reportes.
              <br><br>
              ${escaparHTML(error.message)}
            </div>
          `;

          return;

        }


        if (
          !reportes ||
          reportes.length === 0
        ) {

          container.innerHTML = `
            <div class="empty">

              <div class="icon">
                🦋
              </div>

              <h2>
                Aún no tienes reportes
              </h2>

              <p>
                Cuando envíes un reporte,
                aparecerá aquí su historial y estado.
              </p>

            </div>
          `;

          return;

        }


        container.innerHTML = "";


        reportes.forEach(
          reporte => {

            const estado =
              reporte.status ||
              "Pendiente";


            const card =
              document.createElement(
                "article"
              );

            card.className =
              "reporte";


            card.innerHTML = `

              <div class="reporte-header">

                <div>

                  <h3>
                    🦋 ${escaparHTML(
                      reporte.platform ||
                      "Reporte"
                    )}
                  </h3>

                  <div class="fecha-reporte">

                    Reportado el
                    ${formatearFechaHora(
                      reporte.created_at
                    )}

                  </div>

                </div>


                <span
                  class="estado ${obtenerClaseEstado(
                    estado
                  )}"
                >

                  ${obtenerIconoEstado(
                    estado
                  )}

                  ${escaparHTML(
                    estado
                  )}

                </span>

              </div>


              <div class="datos">

                <div class="dato">

                  <strong>
                    🛍️ Producto / plataforma
                  </strong>

                  <span>
                    ${escaparHTML(
                      reporte.platform ||
                      "No indicado"
                    )}
                  </span>

                </div>


                <div class="dato">

                  <strong>
                    📧 Correo de la cuenta
                  </strong>

                  <span>
                    ${escaparHTML(
                      reporte.purchase_email ||
                      "No indicado"
                    )}
                  </span>

                </div>


                <div class="dato">

                  <strong>
                    👤 Tipo de cuenta
                  </strong>

                  <span>
                    ${escaparHTML(
                      reporte.account_type ||
                      "No indicado"
                    )}
                  </span>

                </div>


                <div class="dato">

                  <strong>
                    📅 Fecha de compra
                  </strong>

                  <span>
                    ${formatearFecha(
                      reporte.purchase_date
                    )}
                  </span>

                </div>


                <div class="dato">

                  <strong>
                    ⚠️ Problema
                  </strong>

                  <span>
                    ${escaparHTML(
                      reporte.problem_type ||
                      "No indicado"
                    )}
                  </span>

                </div>

              </div>


              <div class="bloque">

                <strong>
                  📝 Descripción del problema
                </strong>

                <p>
                  ${escaparHTML(
                    reporte.description
                  )}
                </p>

              </div>


              ${
                reporte.resolved_at
                ? `
                  <div class="bloque solucion">

                    <strong>
                      📅 Fecha de solución
                    </strong>

                    <p>
                      ${formatearFechaHora(
                        reporte.resolved_at
                      )}
                    </p>

                  </div>
                `
                : ""
              }


              ${
                reporte.admin_notes
                ? `
                  <div class="bloque solucion">

                    <strong>
                      💬 Respuesta de administración
                    </strong>

                    <p>
                      ${escaparHTML(
                        reporte.admin_notes
                      )}
                    </p>

                  </div>
                `
                : ""
              }

            `;


            container.appendChild(
              card
            );

          }
        );


      } catch (error) {

        console.error(
          "Error inesperado:",
          error
        );

        container.innerHTML = `
          <div class="error">
            ❌ Ocurrió un error al cargar tus reportes.
          </div>
        `;

      }

    }


    verificarUsuario();

  </script>

</body>
</html>
