<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Reportes | Butterfly Shop</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #f8efff, #eee1ff, #fcecff);
      color: #4b3563;
      min-height: 100vh;
    }

    header {
      background: linear-gradient(135deg, #9b59b6, #c77dff);
      color: white;
      padding: 22px 18px;
      text-align: center;
      box-shadow: 0 4px 15px rgba(120, 70, 150, 0.25);
    }

    header h1 {
      margin: 0;
      font-size: 28px;
    }

    header p {
      margin: 7px 0 0;
      opacity: 0.9;
    }

    .container {
      width: 95%;
      max-width: 1200px;
      margin: 25px auto;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    .top-bar h2 {
      margin: 0;
      color: #713f8d;
    }

    .btn {
      border: none;
      border-radius: 12px;
      padding: 11px 17px;
      cursor: pointer;
      font-weight: bold;
      transition: 0.2s;
    }

    .btn:hover {
      transform: translateY(-1px);
      opacity: 0.92;
    }

    .btn-back {
      background: #ead8f7;
      color: #663b7b;
    }

    .btn-refresh {
      background: linear-gradient(135deg, #9b59b6, #c77dff);
      color: white;
    }

    .message {
      display: none;
      padding: 13px;
      border-radius: 12px;
      margin-bottom: 18px;
      text-align: center;
      font-weight: bold;
    }

    .message.success {
      display: block;
      background: #e8f8ed;
      color: #287544;
    }

    .message.error {
      display: block;
      background: #ffe8ed;
      color: #a8324b;
    }

    .loading {
      text-align: center;
      padding: 35px;
      color: #80549b;
      font-weight: bold;
    }

    .empty {
      background: white;
      border-radius: 18px;
      padding: 35px 20px;
      text-align: center;
      box-shadow: 0 5px 18px rgba(100, 60, 120, 0.12);
    }

    .empty .icon {
      font-size: 45px;
      margin-bottom: 10px;
    }

    .report-card {
      background: white;
      border-radius: 20px;
      margin-bottom: 20px;
      overflow: hidden;
      box-shadow: 0 6px 20px rgba(100, 60, 120, 0.14);
    }

    .report-header {
      background: linear-gradient(135deg, #f1dcff, #f9eaff);
      padding: 17px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
    }

    .report-number {
      font-weight: bold;
      color: #713f8d;
      font-size: 17px;
    }

    .status-badge {
      display: inline-block;
      padding: 7px 12px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: bold;
    }

    .status-pendiente {
      background: #fff0c9;
      color: #8a6500;
    }

    .status-revision {
      background: #dcecff;
      color: #35649b;
    }

    .status-solucionado {
      background: #dcf7e5;
      color: #287544;
    }

    .report-body {
      padding: 20px;
    }

    .info-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
      margin-bottom: 20px;
    }

    .info-box {
      background: #faf6fd;
      border-radius: 12px;
      padding: 13px;
    }

    .info-box.full {
      grid-column: 1 / -1;
    }

    .label {
      display: block;
      font-size: 12px;
      color: #9275a2;
      margin-bottom: 5px;
      font-weight: bold;
    }

    .value {
      color: #4b3563;
      word-break: break-word;
    }

    .description {
      background: #fffafd;
      border-left: 4px solid #c77dff;
      padding: 14px;
      border-radius: 10px;
      white-space: pre-wrap;
      line-height: 1.5;
    }

    .admin-section {
      border-top: 1px solid #eadcf1;
      padding-top: 20px;
      margin-top: 20px;
    }

    .admin-section h3 {
      margin-top: 0;
      color: #713f8d;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 2fr;
      gap: 15px;
      align-items: end;
    }

    .form-group label {
      display: block;
      font-weight: bold;
      font-size: 13px;
      margin-bottom: 7px;
      color: #684478;
    }

    select,
    textarea {
      width: 100%;
      border: 1px solid #ddc8e8;
      border-radius: 10px;
      padding: 11px;
      font-family: inherit;
      background: white;
      color: #4b3563;
      outline: none;
    }

    select:focus,
    textarea:focus {
      border-color: #a967c5;
      box-shadow: 0 0 0 3px rgba(169, 103, 197, 0.12);
    }

    textarea {
      min-height: 80px;
      resize: vertical;
    }

    .save-area {
      margin-top: 15px;
      display: flex;
      justify-content: flex-end;
    }

    .btn-save {
      background: linear-gradient(135deg, #8e44ad, #b76ddd);
      color: white;
      padding: 12px 22px;
    }

    .resolved-date {
      margin-top: 12px;
      font-size: 13px;
      color: #5c8b69;
    }

    .logout {
      margin-top: 25px;
      text-align: center;
    }

    .btn-logout {
      background: #f4dce8;
      color: #8c4160;
    }

    @media (max-width: 700px) {
      .info-grid,
      .form-grid {
        grid-template-columns: 1fr;
      }

      .info-box.full {
        grid-column: auto;
      }

      .report-header {
        align-items: flex-start;
      }

      .container {
        width: 92%;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>🦋 Reportes Butterfly Shop</h1>
  <p>Administración y seguimiento de reportes</p>
</header>

<div class="container">

  <div class="top-bar">
    <h2>📋 Reportes recibidos</h2>

    <div>
      <button class="btn btn-back" onclick="window.location.href='admin.html'">
        ← Panel
      </button>

      <button class="btn btn-refresh" onclick="cargarReportes()">
        🔄 Actualizar
      </button>
    </div>
  </div>

  <div id="message" class="message"></div>

  <div id="loading" class="loading">
    🦋 Cargando reportes...
  </div>

  <div id="reportes"></div>

  <div class="logout">
    <button class="btn btn-logout" onclick="cerrarSesion()">
      Cerrar sesión
    </button>
  </div>

</div>

<script>

  let usuarioActual = null;

  // ============================
  // INICIO
  // ============================

  async function iniciar() {

    const {
      data: { user },
      error
    } = await supabaseClient.auth.getUser();

    if (error || !user) {
      window.location.href = "login.html";
      return;
    }

    usuarioActual = user;

    // Verificar que sea administrador
    const { data: perfil, error: errorPerfil } =
      await supabaseClient
        .from("profiles")
        .select("id, username, email, role")
        .eq("id", user.id)
        .single();

    if (
      errorPerfil ||
      !perfil ||
      perfil.role !== "admin"
    ) {
      alert("No tienes permisos de administrador.");
      window.location.href = "panel.html";
      return;
    }

    cargarReportes();
  }


  // ============================
  // CARGAR REPORTES
  // ============================

  async function cargarReportes() {

    const loading = document.getElementById("loading");
    const contenedor = document.getElementById("reportes");

    loading.style.display = "block";
    contenedor.innerHTML = "";

    const { data: reportes, error } =
      await supabaseClient
        .from("reports")
        .select("*")
        .order("created_at", { ascending: false });

    loading.style.display = "none";

    if (error) {
      mostrarMensaje(
        "No se pudieron cargar los reportes: " + error.message,
        "error"
      );
      return;
    }

    if (!reportes || reportes.length === 0) {

      contenedor.innerHTML = `
        <div class="empty">
          <div class="icon">🦋</div>
          <h3>No hay reportes todavía</h3>
          <p>Cuando un cliente envíe un reporte aparecerá aquí.</p>
        </div>
      `;

      return;
    }

    // Obtener todos los IDs de usuarios
    const userIds = [
      ...new Set(
        reportes
          .map(r => r.user_id)
          .filter(Boolean)
      )
    ];

    let perfiles = {};

    if (userIds.length > 0) {

      const { data: usuarios, error: errorUsuarios } =
        await supabaseClient
          .from("profiles")
          .select("id, username, email")
          .in("id", userIds);

      if (!errorUsuarios && usuarios) {

        usuarios.forEach(usuario => {
          perfiles[usuario.id] = usuario;
        });

      }
    }

    reportes.forEach((reporte, index) => {

      const perfil = perfiles[reporte.user_id] || {};

      contenedor.innerHTML += crearReporte(
        reporte,
        perfil,
        index + 1
      );

    });
  }


  // ============================
  // CREAR TARJETA
  // ============================

  function crearReporte(reporte, perfil, numero) {

    const estado = reporte.status || "Pendiente";

    let claseEstado = "status-pendiente";

    if (estado === "En revisión") {
      claseEstado = "status-revision";
    }

    if (estado === "Solucionado") {
      claseEstado = "status-solucionado";
    }

    const fechaCreacion =
      formatearFecha(reporte.created_at);

    const fechaCompra =
      reporte.purchase_date
        ? formatearFecha(reporte.purchase_date)
        : "No especificada";

    const fechaSolucion =
      reporte.resolved_at
        ? formatearFecha(reporte.resolved_at)
        : "";

    return `

      <div class="report-card">

        <div class="report-header">

          <div class="report-number">
            🦋 Reporte #${numero}
          </div>

          <span class="status-badge ${claseEstado}">
            ${escapeHTML(estado)}
          </span>

        </div>


        <div class="report-body">

          <div class="info-grid">

            <div class="info-box">
              <span class="label">👤 Cliente</span>
              <div class="value">
                ${escapeHTML(perfil.username || "Usuario")}
              </div>
            </div>


            <div class="info-box">
              <span class="label">📧 Email del cliente</span>
              <div class="value">
                ${escapeHTML(perfil.email || "No disponible")}
              </div>
            </div>


            <div class="info-box">
              <span class="label">📺 Plataforma / Producto</span>
              <div class="value">
                ${escapeHTML(reporte.platform || "No especificado")}
              </div>
            </div>


            <div class="info-box">
              <span class="label">📧 Email de la cuenta comprada</span>
              <div class="value">
                ${escapeHTML(reporte.purchase_email || "No especificado")}
              </div>
            </div>


            <div class="info-box">
              <span class="label">👤 Tipo de cuenta</span>
              <div class="value">
                ${escapeHTML(reporte.account_type || "No especificado")}
              </div>
            </div>


            <div class="info-box">
              <span class="label">📅 Fecha de compra</span>
              <div class="value">
                ${escapeHTML(fechaCompra)}
              </div>
            </div>


            <div class="info-box">
              <span class="label">⚠️ Tipo de problema</span>
              <div class="value">
                ${escapeHTML(reporte.problem_type || "No especificado")}
              </div>
            </div>


            <div class="info-box">
              <span class="label">🕐 Reportado</span>
              <div class="value">
                ${escapeHTML(fechaCreacion)}
              </div>
            </div>


            <div class="info-box full">

              <span class="label">
                📝 Descripción del problema
              </span>

              <div class="description">
                ${escapeHTML(reporte.description || "Sin descripción")}
              </div>

            </div>

          </div>


          <div class="admin-section">

            <h3>⚙️ Gestión del reporte</h3>

            <div class="form-grid">

              <div class="form-group">

                <label for="status-${reporte.id}">
                  Estado
                </label>

                <select id="status-${reporte.id}">

                  <option value="Pendiente"
                    ${estado === "Pendiente" ? "selected" : ""}>
                    Pendiente
                  </option>

                  <option value="En revisión"
                    ${estado === "En revisión" ? "selected" : ""}>
                    En revisión
                  </option>

                  <option value="Solucionado"
                    ${estado === "Solucionado" ? "selected" : ""}>
                    Solucionado
                  </option>

                </select>

              </div>


              <div class="form-group">

                <label for="notes-${reporte.id}">
                  💬 Notas administrativas
                </label>

                <textarea
                  id="notes-${reporte.id}"
                  placeholder="Escribe aquí notas sobre la solución, seguimiento, reemplazo, etc."
                >${escapeHTML(reporte.admin_notes || "")}</textarea>

              </div>

            </div>


            ${
              fechaSolucion
                ? `
                  <div class="resolved-date">
                    ✅ Solucionado el: ${escapeHTML(fechaSolucion)}
                  </div>
                `
                : ""
            }


            <div class="save-area">

              <button
                class="btn btn-save"
                onclick="guardarReporte('${reporte.id}', '${estado}')"
              >
                💾 Guardar cambios
              </button>

            </div>

          </div>

        </div>

      </div>
    `;
  }


  // ============================
  // GUARDAR CAMBIOS
  // ============================

  async function guardarReporte(id, estadoAnterior) {

    const nuevoEstado =
      document.getElementById(`status-${id}`).value;

    const notas =
      document.getElementById(`notes-${id}`).value.trim();

    const datos = {
      status: nuevoEstado,
      admin_notes: notas || null
    };


    // Si se marca como solucionado,
    // registrar automáticamente la fecha.
    if (
      nuevoEstado === "Solucionado" &&
      estadoAnterior !== "Solucionado"
    ) {

      datos.resolved_at = new Date().toISOString();

    }


    // Si vuelve a otro estado,
    // quitar la fecha de solución.
    if (
      nuevoEstado !== "Solucionado"
    ) {

      datos.resolved_at = null;

    }


    const { error } =
      await supabaseClient
        .from("reports")
        .update(datos)
        .eq("id", id);


    if (error) {

      mostrarMensaje(
        "No se pudo actualizar el reporte: " + error.message,
        "error"
      );

      return;
    }


    mostrarMensaje(
      "✅ Reporte actualizado correctamente.",
      "success"
    );


    await cargarReportes();
  }


  // ============================
  // FORMATO DE FECHAS
  // ============================

  function formatearFecha(fecha) {

    if (!fecha) {
      return "No disponible";
    }

    const date = new Date(fecha);

    if (isNaN(date.getTime())) {
      return fecha;
    }

    return date.toLocaleString("es-MX", {
      day: "2-digit",
      month: "2-digit",
      year: "numeric",
      hour: "2-digit",
      minute: "2-digit"
    });
  }


  // ============================
  // MENSAJES
  // ============================

  function mostrarMensaje(texto, tipo) {

    const mensaje =
      document.getElementById("message");

    mensaje.textContent = texto;

    mensaje.className =
      "message " + tipo;

    setTimeout(() => {

      mensaje.className = "message";

    }, 4000);
  }


  // ============================
  // SEGURIDAD HTML
  // ============================

  function escapeHTML(texto) {

    if (texto === null || texto === undefined) {
      return "";
    }

    return String(texto)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }


  // ============================
  // CERRAR SESIÓN
  // ============================

  async function cerrarSesion() {

    await supabaseClient.auth.signOut();

    window.location.href = "login.html";
  }


  // ============================
  // EJECUTAR
  // ============================

  iniciar();

</script>

</body>
</html>
