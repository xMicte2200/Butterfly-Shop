<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión | Butterfly Shop</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #f8eaff, #ead7ff, #ffe4f3);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 430px;
      background: rgba(255, 255, 255, 0.95);
      padding: 35px 30px;
      border-radius: 25px;
      box-shadow: 0 10px 35px rgba(130, 70, 160, 0.18);
      text-align: center;
    }

    .logo {
      font-size: 45px;
      margin-bottom: 8px;
    }

    h1 {
      color: #8b4bb5;
      margin-bottom: 8px;
      font-size: 28px;
    }

    .subtitle {
      color: #777;
      font-size: 14px;
      margin-bottom: 28px;
    }

    .input-group {
      text-align: left;
      margin-bottom: 18px;
    }

    label {
      display: block;
      color: #70408f;
      font-weight: bold;
      font-size: 14px;
      margin-bottom: 7px;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 2px solid #ead8f5;
      border-radius: 12px;
      outline: none;
      font-size: 15px;
      transition: 0.2s;
    }

    input:focus {
      border-color: #b66ed6;
      box-shadow: 0 0 0 3px rgba(182, 110, 214, 0.12);
    }

    .options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 5px 0 22px;
      font-size: 13px;
    }

    .remember {
      display: flex;
      align-items: center;
      gap: 6px;
      color: #777;
    }

    .remember input {
      width: auto;
    }

    .forgot {
      color: #9b55bd;
      text-decoration: none;
    }

    .login-btn {
      width: 100%;
      border: none;
      padding: 14px;
      border-radius: 14px;
      background: linear-gradient(90deg, #a957c8, #d878b2);
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 7px 18px rgba(169, 87, 200, 0.25);
      transition: 0.2s;
    }

    .login-btn:hover {
      transform: translateY(-2px);
    }

    .register {
      margin-top: 23px;
      color: #777;
      font-size: 14px;
    }

    .register a {
      color: #984eb9;
      font-weight: bold;
      text-decoration: none;
    }

    .home {
      display: inline-block;
      margin-top: 20px;
      color: #8b4bb5;
      text-decoration: none;
      font-size: 13px;
    }

    .butterflies {
      margin-top: 18px;
      font-size: 18px;
      letter-spacing: 7px;
    }
  </style>
</head>

<body>

  <div class="login-box">

    <div class="logo">🦋</div>

    <h1>Bienvenido de nuevo</h1>

    <p class="subtitle">
      Inicia sesión para entrar a tu cuenta de Butterfly Shop ✨
    </p>

    <form>

      <div class="input-group">
        <label for="email">📧 Correo electrónico</label>
        <input
          type="email"
          id="email"
          placeholder="tu@correo.com"
          required
        >
      </div>

      <div class="input-group">
        <label for="password">🔐 Contraseña</label>
        <input
          type="password"
          id="password"
          placeholder="Ingresa tu contraseña"
          required
        >
      </div>

      <div class="options">

        <label class="remember">
          <input type="checkbox">
          Recordarme
        </label>

        <a href="#" class="forgot">
          ¿Olvidaste tu contraseña?
        </a>

      </div>

      <button type="submit" class="login-btn">
        🦋 Iniciar sesión
      </button>

    </form>

    <p class="register">
      ¿Aún no tienes una cuenta?
      <a href="registro.html">Crear cuenta</a>
    </p>

    <a href="index.html" class="home">
      ← Volver al inicio
    </a>

    <div class="butterflies">
      🦋 ✨ 🦋
    </div>

  </div>

</body>
</html>
