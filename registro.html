<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Crear cuenta | Butterfly Shop</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: linear-gradient(
                135deg,
                #f8e8ff,
                #ead7ff,
                #fce4f2
            );
        }

        .register-box {
            width: 100%;
            max-width: 430px;
            padding: 35px 30px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 25px;
            box-shadow: 0 10px 35px rgba(150, 100, 180, 0.2);
        }

        .logo {
            text-align: center;
            font-size: 55px;
            margin-bottom: 10px;
        }

        h1 {
            text-align: center;
            color: #8d55b8;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 25px;
        }

        form {
            display: flex;
            flex-direction: column;
        }

        label {
            color: #70468f;
            font-weight: bold;
            margin-bottom: 7px;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 13px;
            margin-bottom: 17px;
            border: 1px solid #dcc5e8;
            border-radius: 12px;
            outline: none;
            font-size: 14px;
        }

        input:focus {
            border-color: #a66dcc;
            box-shadow: 0 0 0 3px rgba(166, 109, 204, 0.12);
        }

        .terms {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            margin-bottom: 20px;
        }

        .terms input {
            margin-top: 3px;
        }

        .terms label {
            font-size: 13px;
            font-weight: normal;
            line-height: 1.4;
            color: #666;
        }

        .button {
            border: none;
            padding: 14px;
            border-radius: 14px;
            background: linear-gradient(
                135deg,
                #a76dcc,
                #d58bc5
            );
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .button:hover {
            transform: translateY(-1px);
            opacity: 0.92;
        }

        .button:disabled {
            opacity: 0.6;
            cursor: wait;
            transform: none;
        }

        .login {
            text-align: center;
            margin-top: 22px;
            color: #777;
            font-size: 14px;
        }

        .login a,
        .back {
            color: #8d55b8;
            text-decoration: none;
            font-weight: bold;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="register-box">

        <div class="logo">🦋</div>

        <h1>Crear una cuenta</h1>

        <p class="subtitle">
            Únete a Butterfly Shop y comienza a disfrutar de tu espacio digital.
        </p>

        <form id="register-form">

            <label for="name">Nombre de usuario</label>

            <input
                type="text"
                id="name"
                placeholder="Escribe tu nombre de usuario"
                required
            >

            <label for="email">Correo electrónico</label>

            <input
                type="email"
                id="email"
                placeholder="tucorreo@ejemplo.com"
                required
            >

            <label for="password">Contraseña</label>

            <input
                type="password"
                id="password"
                placeholder="Crea una contraseña"
                required
            >

            <label for="confirm-password">Confirmar contraseña</label>

            <input
                type="password"
                id="confirm-password"
                placeholder="Repite tu contraseña"
                required
            >

            <div class="terms">

                <input
                    type="checkbox"
                    id="terms"
                    required
                >

                <label for="terms">
                    Acepto los términos y condiciones de Butterfly Shop.
                </label>

            </div>

            <button
                type="submit"
                class="button"
                id="register-button"
            >
                ✨ Crear mi cuenta
            </button>

        </form>

        <div class="login">
            ¿Ya tienes una cuenta?
            <a href="login.html">Iniciar sesión</a>
        </div>

        <a href="index.html" class="back">
            ← Volver al inicio
        </a>

    </div>


    <!-- Supabase -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="supabase-config.js"></script>

    <script>

        const { createClient } = supabase;

        const supabaseClient = createClient(
            SUPABASE_URL,
            SUPABASE_ANON_KEY
        );


        const form = document.getElementById("register-form");

        const button = document.getElementById("register-button");


        form.addEventListener("submit", async (event) => {

            event.preventDefault();


            const username =
                document.getElementById("name").value.trim();

            const email =
                document.getElementById("email").value.trim();

            const password =
                document.getElementById("password").value;

            const confirmPassword =
                document.getElementById("confirm-password").value;


            if (password !== confirmPassword) {

                alert("Las contraseñas no coinciden 🦋");

                return;
            }


            button.disabled = true;

            button.textContent = "Creando cuenta... 🦋";


            try {

                const { data, error } =
                    await supabaseClient.auth.signUp({

                        email: email,

                        password: password,

                        options: {

                            data: {
                                username: username
                            }

                        }

                    });


                if (error) {

                    alert(
                        "No se pudo crear la cuenta:\n\n" +
                        error.message
                    );

                    button.disabled = false;

                    button.textContent =
                        "✨ Crear mi cuenta";

                    return;
                }


                alert(
                    "¡Cuenta creada correctamente! 🦋💗"
                );


                window.location.href = "login.html";


            } catch (error) {

                console.error(error);

                alert(
                    "Ocurrió un error inesperado. Inténtalo nuevamente."
                );

                button.disabled = false;

                button.textContent =
                    "✨ Crear mi cuenta";

            }

        });

    </script>

</body>
</html>
