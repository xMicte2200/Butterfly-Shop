<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear cuenta | Butterfly Shop</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px;
            background: linear-gradient(135deg, #f8edff, #eee1ff, #fff5fb);
            color: #4b356b;
        }

        .register-box {
            width: 100%;
            max-width: 430px;
            background: rgba(255,255,255,0.92);
            padding: 35px 30px;
            border-radius: 28px;
            border: 1px solid #ead8ff;
            box-shadow: 0 15px 40px rgba(130,90,170,0.12);
        }

        .logo {
            text-align: center;
            font-size: 45px;
            margin-bottom: 8px;
        }

        h1 {
            text-align: center;
            color: #7544a8;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #907da1;
            font-size: 14px;
            margin-bottom: 28px;
        }

        label {
            display: block;
            margin: 15px 0 7px;
            color: #65467f;
            font-weight: 600;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 14px 15px;
            border-radius: 14px;
            border: 1px solid #ddc8ef;
            outline: none;
            font-size: 15px;
            color: #4b356b;
            background: #fffaff;
        }

        input:focus {
            border-color: #a978df;
            box-shadow: 0 0 0 3px rgba(169,120,223,0.12);
        }

        .terms {
            display: flex;
            align-items: flex-start;
            gap: 9px;
            margin: 18px 0;
            font-size: 12px;
            color: #8c789f;
        }

        .terms input {
            width: auto;
            margin-top: 2px;
        }

        .button {
            width: 100%;
            border: none;
            padding: 15px;
            border-radius: 25px;
            background: linear-gradient(135deg, #a978df, #8050b4);
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        .button:hover {
            opacity: 0.9;
        }

        .login {
            text-align: center;
            margin-top: 22px;
            font-size: 14px;
            color: #8c789f;
        }

        .login a {
            color: #8050b4;
            font-weight: 600;
            text-decoration: none;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 18px;
            color: #8c789f;
            text-decoration: none;
            font-size: 13px;
        }
    </style>
</head>

<body>

    <div class="register-box">

        <div class="logo">🦋</div>

        <h1>Crear una cuenta</h1>

        <p class="subtitle">
            Únete a Butterfly Shop y comienza a disfrutar de tu espacio digital.
        </p>

        <form>

            <label for="name">Nombre de usuario</label>
            <input
                type="text"
                id="name"
                placeholder="Escribe tu nombre de usuario"
                required
            >

            <label for="email">Correo electrónico</label>
            <input
                type="email"
                id="email"
                placeholder="tucorreo@ejemplo.com"
                required
            >

            <label for="password">Contraseña</label>
            <input
                type="password"
                id="password"
                placeholder="Crea una contraseña"
                required
            >

            <label for="confirm-password">Confirmar contraseña</label>
            <input
                type="password"
                id="confirm-password"
                placeholder="Repite tu contraseña"
                required
            >

            <div class="terms">
                <input type="checkbox" id="terms" required>

                <label for="terms">
                    Acepto los términos y condiciones de Butterfly Shop.
                </label>
            </div>

            <button type="submit" class="button">
                ✨ Crear mi cuenta
            </button>

        </form>

        <div class="login">
            ¿Ya tienes una cuenta?
            <a href="login.html">Iniciar sesión</a>
        </div>

        <a href="index.html" class="back">
            ← Volver al inicio
        </a>

    </div>

</body>
</html>
