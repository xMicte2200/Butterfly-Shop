<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo | Butterfly Shop</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #f8edff, #eee1ff, #fff5fb);
            color: #4b356b;
            min-height: 100vh;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 7%;
            background: rgba(255,255,255,0.8);
            border-bottom: 1px solid #ead8ff;
        }

        .logo {
            font-size: 23px;
            font-weight: bold;
            color: #8c5bc4;
        }

        nav a {
            text-decoration: none;
            color: #6e4b91;
            margin-left: 18px;
            font-size: 14px;
        }

        .title {
            text-align: center;
            padding: 55px 20px 25px;
        }

        .title h1 {
            color: #7544a8;
            font-size: 38px;
            margin-bottom: 12px;
        }

        .title p {
            color: #8c789f;
        }

        .categories {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            padding: 15px 20px 35px;
        }

        .category {
            background: white;
            border: 1px solid #e3cff8;
            color: #8050b4;
            padding: 10px 18px;
            border-radius: 25px;
            cursor: pointer;
            transition: 0.2s;
        }

        .category:hover,
        .category.active {
            background: #8050b4;
            color: white;
        }

        .products {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 24px;
            max-width: 1100px;
            margin: auto;
            padding: 20px;
        }

        .product {
            background: rgba(255,255,255,0.9);
            border: 1px solid #ead8ff;
            border-radius: 24px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 8px 25px rgba(130,90,170,0.07);
            transition: 0.3s;
            overflow: hidden;
        }

        .product:hover {
            transform: translateY(-5px);
        }

        /* =================================
           IMAGEN DEL PRODUCTO
        ================================= */

        .product-image {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 18px;
            margin-bottom: 16px;
            background: #f3e7ff;
            display: block;
        }

        /* =================================
           ICONO DE RESPALDO
        ================================= */

        .product-icon {
            width: 100%;
            height: 180px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 55px;
            background: #f8f0ff;
            border-radius: 18px;
            margin-bottom: 16px;
        }

        .product h2 {
            color: #7544a8;
            font-size: 20px;
            margin-bottom: 10px;
        }

        .product p {
            color: #8c789f;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 15px;
        }

        .price {
            font-size: 22px;
            font-weight: bold;
            color: #8c5bc4;
            margin-bottom: 8px;
        }

        .stock {
            font-size: 13px;
            margin-bottom: 18px;
        }

        .stock.available {
            color: #4d9b70;
        }

        .stock.unavailable {
            color: #b96b7c;
        }

        .buy {
            display: inline-block;
            background: linear-gradient(135deg, #a978df, #8050b4);
            color: white;
            text-decoration: none;
            padding: 12px 25px;
            border-radius: 25px;
            font-weight: 600;
            border: none;
            cursor: pointer;
        }

        .buy:hover {
            transform: translateY(-2px);
        }

        .buy.disabled {
            background: #cfc4d8;
            pointer-events: none;
            cursor: not-allowed;
        }

        .loading,
        .empty,
        .error {
            grid-column: 1 / -1;
            text-align: center;
            padding: 40px 20px;
            color: #8c789f;
        }

        .error {
            color: #a75c76;
        }

        footer {
            text-align: center;
            padding: 45px 20px;
            color: #9b83b3;
            font-size: 13px;
        }

        /* ================================
           MODAL DE COMPRA
        ================================ */

        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(50, 30, 70, 0.55);
            backdrop-filter: blur(5px);
            z-index: 9999;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-overlay.show {
            display: flex;
        }

        .purchase-modal {
            width: min(500px, 100%);
            max-height: 90vh;
            overflow-y: auto;
            background: white;
            border-radius: 25px;
            padding: 28px;
            box-shadow: 0 20px 60px rgba(50, 30, 70, 0.25);
            text-align: left;
        }

        .purchase-modal h2 {
            text-align: center;
            color: #7544a8;
            margin-bottom: 8px;
        }

        .purchase-modal .success-text {
            text-align: center;
            color: #5f8f72;
            font-size: 14px;
            margin-bottom: 22px;
        }

        .credential-box {
            background: #faf6ff;
            border: 1px solid #e3cff8;
            border-radius: 16px;
            padding: 15px;
            margin-bottom: 12px;
        }

        .credential-label {
            display: block;
            color: #8c5bc4;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .credential-value {
            color: #4b356b;
            font-size: 15px;
            word-break: break-word;
        }

        .modal-close {
            width: 100%;
            margin-top: 10px;
            padding: 12px;
            border: none;
            border-radius: 22px;
            background: #8050b4;
            color: white;
            font-weight: 600;
            cursor: pointer;
        }

        .modal-close:hover {
            background: #7544a8;
        }

        @media (max-width: 600px) {

            header {
                padding: 15px 5%;
            }

            .logo {
                font-size: 18px;
            }

            nav a {
                margin-left: 8px;
                font-size: 12px;
            }

            .title {
                padding-top: 35px;
            }

            .title h1 {
                font-size: 30px;
            }

            .products {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 14px;
                padding: 14px;
            }

            .product {
                padding: 14px;
                border-radius: 18px;
            }

            .product-image,
            .product-icon {
                height: 130px;
                border-radius: 14px;
            }

            .product-icon {
                font-size: 42px;
            }

            .product h2 {
                font-size: 16px;
            }

            .product p {
                font-size: 12px;
            }

            .price {
                font-size: 18px;
            }

            .buy {
                padding: 10px 17px;
                font-size: 12px;
            }
        }
    </style>
</head>

<body>

    <header>

        <div class="logo">
            🦋 Butterfly Shop
        </div>

        <nav>
            <a href="index.html">Inicio</a>
            <a href="catalogo.html">Catálogo</a>
            <a href="login.html">Mi cuenta</a>
        </nav>

    </header>


    <section class="title">

        <h1>
            🛍️ Nuestro catálogo
        </h1>

        <p>
            Explora nuestros productos digitales disponibles.
        </p>

    </section>


    <div
        class="categories"
        id="categories"
    >

        <button
            class="category active"
            data-category="Todos"
        >
            ✨ Todos
        </button>

    </div>


    <section
        class="products"
        id="products"
    >

        <div class="loading">
            🦋 Cargando productos...
        </div>

    </section>


    <footer>
        🦋 Butterfly Shop · Catálogo digital
    </footer>


    <!-- ================================
         MODAL RESULTADO DE COMPRA
    ================================= -->

    <div
        class="modal-overlay"
        id="purchaseModal"
    >

        <div class="purchase-modal">

            <h2>
                🦋 ¡Compra realizada!
            </h2>

            <div class="success-text">
                Tu producto fue entregado correctamente.
            </div>

            <div id="purchaseDetails"></div>

            <button
                class="modal-close"
                type="button"
                onclick="cerrarModalCompra()"
            >
                💗 Cerrar
            </button>

        </div>

    </div>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>


    <script>

        const productsContainer =
            document.getElementById("products");

        const categoriesContainer =
            document.getElementById("categories");

        const purchaseModal =
            document.getElementById("purchaseModal");

        const purchaseDetails =
            document.getElementById("purchaseDetails");

        let allProducts = [];

        let currentCategory = "Todos";


        // ================================
        // CARGAR PRODUCTOS
        // ================================

        async function cargarProductos() {

            try {

                const {
                    data: products,
                    error
                } = await supabaseClient
                    .from("products")
                    .select(`
                        id,
                        name,
                        description,
                        price_credits,
                        category,
                        active,
                        image_url,
                        created_at
                    `)
                    .eq("active", true)
                    .order("created_at", {
                        ascending: false
                    });


                if (error) {
                    throw error;
                }


                allProducts =
                    products || [];


                if (allProducts.length === 0) {

                    productsContainer.innerHTML = `
                        <div class="empty">
                            🦋 No hay productos disponibles por el momento.
                        </div>
                    `;

                    return;
                }


                crearCategorias();

                await mostrarProductos();


            } catch (error) {

                console.error(
                    "Error cargando productos:",
                    error
                );

                productsContainer.innerHTML = `
                    <div class="error">

                        ❌ No pudimos cargar el catálogo.

                        <br><br>

                        ${escaparHTML(
                            error.message ||
                            "Error desconocido"
                        )}

                    </div>
                `;
            }
        }


        // ================================
        // CREAR CATEGORÍAS
        // ================================

        function crearCategorias() {

            const categorias = [
                ...new Set(
                    allProducts
                        .map(
                            product =>
                                product.category
                        )
                        .filter(
                            category =>
                                category &&
                                category.trim() !== ""
                        )
                )
            ];


            categoriesContainer.innerHTML = `

                <button
                    class="category active"
                    data-category="Todos"
                >
                    ✨ Todos
                </button>

            `;


            categorias.forEach(category => {

                const button =
                    document.createElement(
                        "button"
                    );

                button.className =
                    "category";

                button.dataset.category =
                    category;

                button.textContent =
                    `💎 ${category}`;


                categoriesContainer
                    .appendChild(button);

            });


            document
                .querySelectorAll(".category")
                .forEach(button => {

                    button.addEventListener(
                        "click",
                        async () => {

                            currentCategory =
                                button.dataset.category;


                            document
                                .querySelectorAll(
                                    ".category"
                                )
                                .forEach(btn => {

                                    btn.classList
                                        .remove(
                                            "active"
                                        );

                                });


                            button.classList
                                .add("active");


                            await mostrarProductos();

                        }
                    );

                });
        }


        // ================================
        // MOSTRAR PRODUCTOS
        // ================================

        async function mostrarProductos() {

            let productosMostrar =
                allProducts;


            if (
                currentCategory !==
                "Todos"
            ) {

                productosMostrar =
                    allProducts.filter(
                        product =>
                            product.category ===
                            currentCategory
                    );

            }


            if (
                productosMostrar.length ===
                0
            ) {

                productsContainer.innerHTML = `

                    <div class="empty">

                        🦋 No hay productos
                        en esta categoría.

                    </div>

                `;

                return;
            }


            productsContainer.innerHTML = `

                <div class="loading">

                    🦋 Revisando disponibilidad...

                </div>

            `;


            const stockMap = {};


            for (
                const product
                of productosMostrar
            ) {

                const {
                    data: stock,
                    error
                } = await supabaseClient.rpc(
                    "get_product_stock",
                    {
                        p_product_id:
                            product.id
                    }
                );


                if (error) {

                    console.error(
                        "Error comprobando inventario:",
                        product.name,
                        error
                    );

                    stockMap[
                        product.id
                    ] = 0;

                } else {

                    stockMap[
                        product.id
                    ] =
                        Number(
                            stock || 0
                        );

                }
            }


            productsContainer.innerHTML =
                "";


            productosMostrar.forEach(
                product => {

                    const stock =
                        stockMap[
                            product.id
                        ] || 0;


                    const disponible =
                        stock > 0;


                    const card =
                        document.createElement(
                            "div"
                        );


                    card.className =
                        "product";


                    /*
                     * ==================================
                     * IMAGEN DEL PRODUCTO
                     *
                     * Si image_url existe:
                     *     mostramos la imagen subida.
                     *
                     * Si no existe:
                     *     mostramos el emoji de respaldo.
                     * ==================================
                     */

                    let visualProducto;


                    if (
                        product.image_url &&
                        product.image_url.trim() !== ""
                    ) {

                        visualProducto = `

                            <img
                                src="${escaparHTML(
                                    product.image_url
                                )}"
                                class="product-image"
                                alt="${escaparHTML(
                                    product.name ||
                                    "Producto"
                                )}"
                                loading="lazy"
                                onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';"
                            >

                            <div
                                class="product-icon"
                                style="display:none;"
                            >
                                ${obtenerIcono(
                                    product.category
                                )}
                            </div>

                        `;

                    } else {

                        visualProducto = `

                            <div
                                class="product-icon"
                            >
                                ${obtenerIcono(
                                    product.category
                                )}
                            </div>

                        `;
                    }


                    card.innerHTML = `

                        ${visualProducto}


                        <h2>

                            ${escaparHTML(
                                product.name
                            )}

                        </h2>


                        <p>

                            ${escaparHTML(
                                product.description ||
                                "Producto digital disponible en Butterfly Shop."
                            )}

                        </p>


                        <div class="price">

                            💎
                            ${product.price_credits}
                            créditos

                        </div>


                        <div
                            class="stock ${
                                disponible
                                    ? "available"
                                    : "unavailable"
                            }"
                        >

                            ${
                                disponible
                                    ? "🟢 Disponible"
                                    : "🔴 Agotado"
                            }

                        </div>


                        ${
                            disponible

                                ? `

                                    <button
                                        class="buy"
                                        type="button"
                                        onclick="comprarProducto('${product.id}')"
                                    >
                                        🛒 Comprar
                                    </button>

                                  `

                                : `

                                    <span
                                        class="buy disabled"
                                    >
                                        Agotado
                                    </span>

                                  `
                        }

                    `;


                    productsContainer
                        .appendChild(card);

                }
            );
        }


        // ================================
        // COMPRAR PRODUCTO
        // ================================

        async function comprarProducto(
            productId
        ) {

            try {

                const {
                    data: {
                        session
                    }
                } =
                    await supabaseClient
                        .auth
                        .getSession();


                if (!session) {

                    alert(
                        "🦋 Debes iniciar sesión para comprar este producto."
                    );

                    window.location.href =
                        "login.html";

                    return;
                }


                const confirmar =
                    confirm(
                        "🦋 ¿Quieres comprar este producto con tus créditos?"
                    );


                if (!confirmar) {
                    return;
                }


                const {
                    data,
                    error
                } =
                    await supabaseClient.rpc(
                        "buy_product",
                        {
                            p_product_id:
                                productId
                        }
                    );


                if (error) {
                    throw error;
                }


                const compra =
                    Array.isArray(data)
                        ? data[0]
                        : data;


                if (
                    !compra ||
                    !compra.success
                ) {

                    throw new Error(
                        "No se recibió correctamente la información de la compra."
                    );
                }


                // ================================
                // MOSTRAR ENTREGA
                // ================================

                purchaseDetails.innerHTML = `

                    <div class="credential-box">

                        <span
                            class="credential-label"
                        >
                            🛍️ Producto
                        </span>

                        <div
                            class="credential-value"
                        >
                            ${escaparHTML(
                                compra.product_name ||
                                "Producto"
                            )}
                        </div>

                    </div>


                    <div class="credential-box">

                        <span
                            class="credential-label"
                        >
                            💎 Costo
                        </span>

                        <div
                            class="credential-value"
                        >
                            ${escaparHTML(
                                String(
                                    compra.price_credits ??
                                    ""
                                )
                            )}
                            créditos
                        </div>

                    </div>


                    <div class="credential-box">

                        <span
                            class="credential-label"
                        >
                            📧 Correo
                        </span>

                        <div
                            class="credential-value"
                        >
                            ${escaparHTML(
                                compra.email ||
                                "No disponible"
                            )}
                        </div>

                    </div>


                    <div class="credential-box">

                        <span
                            class="credential-label"
                        >
                            🔑 Contraseña
                        </span>

                        <div
                            class="credential-value"
                        >
                            ${escaparHTML(
                                compra.password ||
                                "No disponible"
                            )}
                        </div>

                    </div>


                    ${
                        compra.profile_name

                            ? `

                                <div
                                    class="credential-box"
                                >

                                    <span
                                        class="credential-label"
                                    >
                                        👤 Perfil
                                    </span>

                                    <div
                                        class="credential-value"
                                    >
                                        ${escaparHTML(
                                            compra.profile_name
                                        )}
                                    </div>

                                </div>

                              `

                            : ""
                    }


                    ${
                        compra.profile_pin

                            ? `

                                <div
                                    class="credential-box"
                                >

                                    <span
                                        class="credential-label"
                                    >
                                        🔢 PIN
                                    </span>

                                    <div
                                        class="credential-value"
                                    >
                                        ${escaparHTML(
                                            compra.profile_pin
                                        )}
                                    </div>

                                </div>

                              `

                            : ""
                    }


                    <div class="credential-box">

                        <span
                            class="credential-label"
                        >
                            🧾 ID de compra
                        </span>

                        <div
                            class="credential-value"
                        >
                            ${escaparHTML(
                                compra.purchase_id ||
                                "No disponible"
                            )}
                        </div>

                    </div>

                `;


                purchaseModal.classList
                    .add("show");


                /*
                 * Recargar catálogo para
                 * actualizar stock.
                 */

                await cargarProductos();


            } catch (error) {

                console.error(
                    "Error realizando compra:",
                    error
                );


                let mensaje =
                    error.message ||
                    "Error desconocido.";


                if (
                    error.details &&
                    typeof error.details ===
                        "string"
                ) {

                    mensaje =
                        error.details;
                }


                alert(
                    "❌ No se pudo completar la compra.\n\n" +
                    mensaje
                );
            }
        }


        // ================================
        // CERRAR MODAL
        // ================================

        function cerrarModalCompra() {

            purchaseModal.classList
                .remove("show");

        }


        purchaseModal.addEventListener(
            "click",
            event => {

                if (
                    event.target ===
                    purchaseModal
                ) {

                    cerrarModalCompra();

                }

            }
        );


        // ================================
        // ICONOS POR CATEGORÍA
        // ================================

        function obtenerIcono(
            category
        ) {

            if (!category) {
                return "🎁";
            }


            const categoria =
                category.toLowerCase();


            if (
                categoria.includes(
                    "plataforma"
                )
            ) {

                return "📺";

            }


            if (
                categoria.includes(
                    "streaming"
                )
            ) {

                return "📺";

            }


            if (
                categoria.includes(
                    "diseño"
                )
            ) {

                return "🎨";

            }


            if (
                categoria.includes(
                    "curso"
                )
            ) {

                return "📚";

            }


            if (
                categoria.includes(
                    "video"
                )
            ) {

                return "🎬";

            }


            return "🎁";
        }


        // ================================
        // PROTECCIÓN HTML
        // ================================

        function escaparHTML(
            texto
        ) {

            const div =
                document.createElement(
                    "div"
                );


            div.textContent =
                texto == null
                    ? ""
                    : String(texto);


            return div.innerHTML;
        }


        // ================================
        // INICIAR CATÁLOGO
        // ================================

        cargarProductos();

    </script>

</body>
</html>
