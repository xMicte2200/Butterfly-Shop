<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo | Butterfly Shop</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #f8edff, #eee1ff, #fff5fb);
            color: #4b356b;
            min-height: 100vh;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 7%;
            background: rgba(255,255,255,0.8);
            border-bottom: 1px solid #ead8ff;
        }

        .logo {
            font-size: 23px;
            font-weight: bold;
            color: #8c5bc4;
        }

        nav a {
            text-decoration: none;
            color: #6e4b91;
            margin-left: 18px;
            font-size: 14px;
        }

        .title {
            text-align: center;
            padding: 55px 20px 25px;
        }

        .title h1 {
            color: #7544a8;
            font-size: 38px;
            margin-bottom: 12px;
        }

        .title p {
            color: #8c789f;
        }

        .categories {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            padding: 15px 20px 35px;
        }

        .category {
            background: white;
            border: 1px solid #e3cff8;
            color: #8050b4;
            padding: 10px 18px;
            border-radius: 25px;
            cursor: pointer;
            transition: 0.2s;
        }

        .category:hover,
        .category.active {
            background: #8050b4;
            color: white;
        }

        .products {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 24px;
            max-width: 1100px;
            margin: auto;
            padding: 20px;
        }

        .product {
            background: rgba(255,255,255,0.9);
            border: 1px solid #ead8ff;
            border-radius: 24px;
            padding: 25px;
            text-align: center;
            box-shadow: 0 8px 25px rgba(130,90,170,0.07);
            transition: 0.3s;
        }

        .product:hover {
            transform: translateY(-5px);
        }

        .product-icon {
            font-size: 48px;
            margin-bottom: 15px;
        }

        .product h2 {
            color: #7544a8;
            font-size: 20px;
            margin-bottom: 10px;
        }

        .product p {
            color: #8c789f;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 15px;
        }

        .price {
            font-size: 22px;
            font-weight: bold;
            color: #8c5bc4;
            margin-bottom: 8px;
        }

        .stock {
            font-size: 13px;
            margin-bottom: 18px;
        }

        .stock.available {
            color: #4d9b70;
        }

        .stock.unavailable {
            color: #b96b7c;
        }

        .buy {
            display: inline-block;
            background: linear-gradient(135deg, #a978df, #8050b4);
            color: white;
            text-decoration: none;
            padding: 12px 25px;
            border-radius: 25px;
            font-weight: 600;
        }

        .buy.disabled {
            background: #cfc4d8;
            pointer-events: none;
        }

        .loading,
        .empty,
        .error {
            grid-column: 1 / -1;
            text-align: center;
            padding: 40px 20px;
            color: #8c789f;
        }

        .error {
            color: #a75c76;
        }

        footer {
            text-align: center;
            padding: 45px 20px;
            color: #9b83b3;
            font-size: 13px;
        }
    </style>
</head>

<body>

    <header>
        <div class="logo">🦋 Butterfly Shop</div>

        <nav>
            <a href="index.html">Inicio</a>
            <a href="catalogo.html">Catálogo</a>
            <a href="login.html">Mi cuenta</a>
        </nav>
    </header>

    <section class="title">
        <h1>🛍️ Nuestro catálogo</h1>
        <p>Explora nuestros productos digitales disponibles.</p>
    </section>

    <div class="categories" id="categories">
        <button class="category active" data-category="Todos">
            ✨ Todos
        </button>
    </div>

    <section class="products" id="products">
        <div class="loading">
            🦋 Cargando productos...
        </div>
    </section>

    <footer>
        🦋 Butterfly Shop · Catálogo digital
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>

    <script>
        const productsContainer = document.getElementById("products");
        const categoriesContainer = document.getElementById("categories");

        let allProducts = [];
        let currentCategory = "Todos";

        async function cargarProductos() {
            try {
                const { data: products, error } = await supabaseClient
                    .from("products")
                    .select(`
                        id,
                        name,
                        description,
                        price_credits,
                        category,
                        active
                    `)
                    .eq("active", true)
                    .order("created_at", { ascending: false });

                if (error) {
                    throw error;
                }

                allProducts = products || [];

                if (allProducts.length === 0) {
                    productsContainer.innerHTML = `
                        <div class="empty">
                            🦋 No hay productos disponibles por el momento.
                        </div>
                    `;
                    return;
                }

                crearCategorias();
                await mostrarProductos();

            } catch (error) {
                console.error("Error cargando productos:", error);

                productsContainer.innerHTML = `
                    <div class="error">
                        ❌ No pudimos cargar el catálogo.
                        <br>
                        Intenta nuevamente más tarde.
                    </div>
                `;
            }
        }

        function crearCategorias() {
            const categorias = [
                ...new Set(
                    allProducts
                        .map(product => product.category)
                        .filter(category => category && category.trim() !== "")
                )
            ];

            categoriesContainer.innerHTML = `
                <button class="category active" data-category="Todos">
                    ✨ Todos
                </button>
            `;

            categorias.forEach(category => {
                const button = document.createElement("button");

                button.className = "category";
                button.dataset.category = category;
                button.textContent = `💎 ${category}`;

                categoriesContainer.appendChild(button);
            });

            document.querySelectorAll(".category").forEach(button => {
                button.addEventListener("click", () => {
                    currentCategory = button.dataset.category;

                    document.querySelectorAll(".category").forEach(btn => {
                        btn.classList.remove("active");
                    });

                    button.classList.add("active");

                    mostrarProductos();
                });
            });
        }

        async function mostrarProductos() {
            let productosMostrar = allProducts;

            if (currentCategory !== "Todos") {
                productosMostrar = allProducts.filter(
                    product => product.category === currentCategory
                );
            }

            if (productosMostrar.length === 0) {
                productsContainer.innerHTML = `
                    <div class="empty">
                        🦋 No hay productos en esta categoría.
                    </div>
                `;
                return;
            }

            productsContainer.innerHTML = `
                <div class="loading">
                    🦋 Revisando disponibilidad...
                </div>
            `;

            const productIds = productosMostrar.map(product => product.id);

            const { data: inventory, error } = await supabaseClient
                .from("inventory")
                .select("product_id")
                .in("product_id", productIds)
                .eq("status", "available");

            if (error) {
                console.error("Error comprobando inventario:", error);
            }

            const stockMap = {};

            (inventory || []).forEach(item => {
                stockMap[item.product_id] =
                    (stockMap[item.product_id] || 0) + 1;
            });

            productsContainer.innerHTML = "";

            productosMostrar.forEach(product => {
                const stock = stockMap[product.id] || 0;
                const disponible = stock > 0;

                const card = document.createElement("div");
                card.className = "product";

                card.innerHTML = `
                    <div class="product-icon">
                        ${obtenerIcono(product.category)}
                    </div>

                    <h2>${escaparHTML(product.name)}</h2>

                    <p>
                        ${escaparHTML(
                            product.description ||
                            "Producto digital disponible en Butterfly Shop."
                        )}
                    </p>

                    <div class="price">
                        💎 ${product.price_credits} créditos
                    </div>

                    <div class="stock ${disponible ? "available" : "unavailable"}">
                        ${
                            disponible
                                ? `🟢 Disponible`
                                : `🔴 Agotado`
                        }
                    </div>

                    ${
                        disponible
                            ? `
                                <a href="login.html" class="buy">
                                    Comprar
                                </a>
                              `
                            : `
                                <span class="buy disabled">
                                    Agotado
                                </span>
                              `
                    }
                `;

                productsContainer.appendChild(card);
            });
        }

        function obtenerIcono(category) {
            if (!category) return "🎁";

            const categoria = category.toLowerCase();

            if (categoria.includes("plataforma")) return "📺";
            if (categoria.includes("diseño")) return "🎨";
            if (categoria.includes("curso")) return "📚";
            if (categoria.includes("video")) return "🎬";

            return "🎁";
        }

        function escaparHTML(texto) {
            const div = document.createElement("div");
            div.textContent = texto;
            return div.innerHTML;
        }

        cargarProductos();
    </script>

</body>
</html>
