<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Butterfly Shop | Productos</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #faf7ff;
      color: #33243f;
    }

    header {
      background: linear-gradient(135deg, #b98cff, #e7a8d8);
      color: white;
      padding: 20px;
      box-shadow: 0 4px 15px #b98cff55;
    }

    .header-content {
      max-width: 1200px;
      margin: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
    }

    .back-btn {
      text-decoration: none;
      background: #ffffff33;
      color: white;
      padding: 9px 14px;
      border-radius: 12px;
      font-weight: bold;
      font-size: 14px;
    }

    .back-btn:hover {
      background: #ffffff55;
    }

    .container {
      max-width: 1200px;
      margin: 30px auto;
      padding: 0 18px;
    }

    .welcome {
      margin-bottom: 25px;
    }

    .welcome h1 {
      color: #743d91;
      margin-bottom: 8px;
    }

    .welcome p {
      color: #77677f;
    }

    .products-box {
      background: white;
      border: 1px solid #eadcff;
      border-radius: 18px;
      padding: 25px;
      box-shadow: 0 5px 18px #8d5ca515;
    }

    .products-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin-bottom: 20px;
    }

    .products-header h2 {
      color: #66377f;
    }

    .btn {
      border: none;
      cursor: pointer;
      background: linear-gradient(135deg, #9b6de3, #d98bc9);
      color: white;
      padding: 10px 15px;
      border-radius: 12px;
      font-weight: bold;
      font-size: 14px;
    }

    .btn:hover {
      opacity: 0.9;
    }

    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 18px;
    }

    .product-card {
      border: 1px solid #eadcff;
      border-radius: 16px;
      padding: 18px;
      background: #fcf9ff;
    }

    .product-card h3 {
      color: #743d91;
      margin-bottom: 8px;
      font-size: 20px;
    }

    .product-description {
      color: #77677f;
      margin-bottom: 15px;
      line-height: 1.5;
    }

    .product-info {
      display: flex;
      flex-direction: column;
      gap: 7px;
      margin-bottom: 12px;
      font-size: 14px;
    }

    .price {
      color: #8a4db0;
      font-weight: bold;
      font-size: 17px;
    }

    .active {
      color: #2e8b57;
      font-weight: bold;
    }

    .inactive {
      color: #b34d4d;
      font-weight: bold;
    }

    .empty-message {
      text-align: center;
      color: #8a7b91;
      padding: 40px 15px;
    }

    .error-message {
      text-align: center;
      color: #b34d4d;
      background: #fff0f0;
      border: 1px solid #f0cccc;
      padding: 20px;
      border-radius: 12px;
    }

    @media (max-width: 600px) {

      .header-content {
        flex-direction: column;
        text-align: center;
      }

      .products-header {
        flex-direction: column;
        align-items: stretch;
      }

      .products-header .btn {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <header>

    <div class="header-content">

      <div class="logo">
        🦋 Butterfly Shop
      </div>

      <a href="admin.html" class="back-btn">
        ← Volver al panel
      </a>

    </div>

  </header>


  <main class="container">

    <div class="welcome">

      <h1>
        🛍️ Gestionar productos
      </h1>

      <p>
        Crea, modifica, activa o desactiva los productos de Butterfly Shop.
      </p>

    </div>


    <div class="products-box">

      <div class="products-header">

        <h2>
          🦋 Productos de la tienda
        </h2>

        <button class="btn" onclick="crearProducto()">
          ➕ Nuevo producto
        </button>

      </div>


      <div id="products-container">

        <div class="empty-message">
          🦋✨ Cargando productos...
        </div>

      </div>

    </div>

  </main>


  <!-- Supabase -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Configuración de Supabase -->

  <script src="supabase-config.js"></script>


  <script>

    async function cargarProductos() {

      const container = document.getElementById("products-container");

      container.innerHTML = `
        <div class="empty-message">
          🦋✨ Cargando productos...
        </div>
      `;


      const { data, error } = await supabaseClient
        .from("products")
        .select("*");


      if (error) {

        console.error("Error al cargar productos:", error);

        container.innerHTML = `
          <div class="error-message">
            ❌ No se pudieron cargar los productos.
            <br><br>
            ${error.message}
          </div>
        `;

        return;
      }


      if (!data || data.length === 0) {

        container.innerHTML = `
          <div class="empty-message">
            🦋✨ Aún no hay productos cargados.
            <br><br>
            Puedes crear el primero usando
            <strong>➕ Nuevo producto</strong>.
          </div>
        `;

        return;
      }


      container.innerHTML = `
        <div class="products-grid">

          ${data.map(producto => `

            <div class="product-card">

              <h3>
                ${producto.name ?? "Sin nombre"}
              </h3>

              <div class="product-description">
                ${producto.descripción ?? "Sin descripción"}
              </div>

              <div class="product-info">

                <div class="price">
                  💎 ${producto.price_credits ?? 0} créditos
                </div>

                <div>
                  🏷️ Categoría:
                  ${producto.categoria ?? "Sin categoría"}
                </div>

                <div>
                  🆔 ID:
                  ${producto.id ?? "Sin ID"}
                </div>

                <div>
                  ${
                    producto.active
                      ? `<span class="active">🟢 Activo</span>`
                      : `<span class="inactive">🔴 Inactivo</span>`
                  }
                </div>

              </div>

            </div>

          `).join("")}

        </div>
      `;

    }


    function crearProducto() {

      alert(
        "🦋✨ El formulario para crear productos lo agregaremos en el siguiente paso."
      );

    }


    cargarProductos();

  </script>

</body>
</html>
