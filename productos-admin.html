<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Butterfly Shop | Productos</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #faf7ff;
      color: #33243f;
    }

    header {
      background: linear-gradient(135deg, #b98cff, #e7a8d8);
      color: white;
      padding: 20px;
      box-shadow: 0 4px 15px #b98cff55;
    }

    .header-content {
      max-width: 1200px;
      margin: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
    }

    .back-btn {
      text-decoration: none;
      background: #ffffff33;
      color: white;
      padding: 9px 14px;
      border-radius: 12px;
      font-weight: bold;
      font-size: 14px;
    }

    .back-btn:hover {
      background: #ffffff55;
    }

    .container {
      max-width: 1200px;
      margin: 30px auto;
      padding: 0 18px;
    }

    .welcome {
      margin-bottom: 25px;
    }

    .welcome h1 {
      color: #743d91;
      margin-bottom: 8px;
    }

    .welcome p {
      color: #77677f;
    }

    .products-box {
      background: white;
      border: 1px solid #eadcff;
      border-radius: 18px;
      padding: 25px;
      box-shadow: 0 5px 18px #8d5ca515;
    }

    .products-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin-bottom: 20px;
    }

    .products-header h2 {
      color: #66377f;
    }

    .btn {
      border: none;
      cursor: pointer;
      background: linear-gradient(135deg, #9b6de3, #d98bc9);
      color: white;
      padding: 10px 15px;
      border-radius: 12px;
      font-weight: bold;
      font-size: 14px;
    }

    .btn:hover {
      opacity: 0.9;
    }

    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 18px;
    }

    .product-card {
      border: 1px solid #eadcff;
      border-radius: 16px;
      padding: 18px;
      background: #fcf9ff;
      overflow: hidden;
    }

    .product-image {
      width: 100%;
      height: 180px;
      object-fit: cover;
      border-radius: 13px;
      margin-bottom: 15px;
      background: #f1e9ff;
      display: block;
    }

    .no-image {
      width: 100%;
      height: 180px;
      border-radius: 13px;
      margin-bottom: 15px;
      background: linear-gradient(135deg, #f1e9ff, #fce8f7);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #9a7cab;
      font-size: 45px;
    }

    .product-card h3 {
      color: #743d91;
      margin-bottom: 8px;
      font-size: 20px;
    }

    .product-description {
      color: #77677f;
      margin-bottom: 15px;
      line-height: 1.5;
    }

    .product-info {
      display: flex;
      flex-direction: column;
