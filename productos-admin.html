<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Productos | Butterfly Shop</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #f7ecff, #eee1ff, #fceeff);
      min-height: 100vh;
      color: #4a315c;
    }

    header {
      background: linear-gradient(135deg, #9b59b6, #c77dff);
      color: white;
      padding: 20px;
      text-align: center;
      box-shadow: 0 4px 15px rgba(100, 50, 120, 0.2);
      position: relative;
    }

    header h1 {
      font-size: 25px;
      margin-bottom: 5px;
    }

    header p {
      font-size: 14px;
      opacity: 0.95;
    }

    .back-btn {
      position: absolute;
      left: 15px;
      top: 18px;
      background: rgba(255,255,255,0.2);
      border: 1px solid rgba(255,255,255,0.4);
      color: white;
      padding: 9px 13px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 13px;
    }

    .container {
      max-width: 1100px;
      margin: 30px auto;
      padding: 0 20px 40px;
    }

    .top-actions {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 20px;
    }

    .primary-btn {
      border: none;
      background: linear-gradient(135deg, #9b59b6, #c77dff);
      color: white;
      padding: 12px 18px;
      border-radius: 12px;
      cursor: pointer;
      font-weight: bold;
      box-shadow: 0 4px 10px rgba(130, 70, 150, 0.2);
    }

    .primary-btn:hover {
      transform: translateY(-1px);
    }

    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
    }

    .product-card {
      background: rgba(255,255,255,0.95);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 6px 20px rgba(100, 60, 120, 0.12);
      border: 1px solid rgba(190, 150, 210, 0.3);
    }

    .product-image {
      width: 100%;
      height: 190px;
      object-fit: cover;
      background: #f3eaff;
    }

    .product-content {
      padding: 18px;
    }

    .product-name {
      font-size: 19px;
      font-weight: bold;
      margin-bottom: 8px;
      color: #613878;
    }

    .product-description {
      font-size: 13px;
      color: #725b7d;
      line-height: 1.5;
      margin-bottom: 12px;
      min-height: 40px;
    }

    .product-info {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-bottom: 15px;
    }

    .badge {
      padding: 6px 9px;
      border-radius: 9px;
      font-size: 11px;
      font-weight: bold;
      background: #f0ddff;
      color: #70418b;
    }

    .badge-price {
      background: #ffe1f2;
      color: #a23e73;
    }

    .badge-active {
      background: #ddf8e7;
      color: #267746;
    }

    .badge-inactive {
      background: #f1e5e8;
      color: #875b67;
    }

    .inventory-summary {
      background: #faf5ff;
      border-radius: 12px;
      padding: 11px;
      margin-bottom: 14px;
      font-size: 13px;
    }

    .inventory-summary strong {
      color: #713f8c;
    }

    .product-actions {
      display: flex;
      gap: 8px;
    }

    .product-actions button {
      flex: 1;
      border: none;
      padding: 11px 8px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
      font-size: 12px;
    }

    .edit-product-btn {
      background: #f2ddff;
      color: #713f8c;
    }

    .inventory-btn {
      background: #e8dcff;
      color: #60408a;
    }

    .product-actions button:hover {
      opacity: 0.88;
    }

    .empty {
      background: white;
      padding: 35px;
      text-align: center;
      border-radius: 18px;
      color: #80678c;
      box-shadow: 0 5px 18px rgba(100, 60, 120, 0.08);
    }

    .loading {
      text-align: center;
      padding: 40px;
      color: #765381;
    }

    /* MODALES */

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(45, 25, 55, 0.55);
      justify-content: center;
      align-items: center;
      padding: 20px;
      z-index: 1000;
    }

    .modal-content {
      width: 100%;
      max-width: 560px;
      max-height: 92vh;
      overflow-y: auto;
      background: white;
      border-radius: 22px;
      padding: 24px;
      box-shadow: 0 12px 40px rgba(40, 20, 50, 0.25);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .modal-header h2 {
      color: #613878;
      font-size: 21px;
    }

    .close-btn {
      border: none;
      background: #f4e9fa;
      color: #75478d;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 18px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: bold;
      color: #654470;
      margin-bottom: 7px;
    }

    .form-group input,
    .form-group textarea,
    .form-group select {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid #ddcbe5;
      border-radius: 10px;
      outline: none;
      font-size: 14px;
      background: #fff;
      color: #4c3557;
    }

    .form-group input:focus,
    .form-group textarea:focus,
    .form-group select:focus {
      border-color: #b56bd3;
      box-shadow: 0 0 0 3px rgba(181, 107, 211, 0.1);
    }

    textarea {
      resize: vertical;
      min-height: 90px;
    }

    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 9px;
      background: #faf5ff;
      padding: 11px;
      border-radius: 10px;
    }

    .checkbox-group input {
      width: auto;
    }

    .checkbox-group label {
      margin: 0;
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    .modal-actions button {
      flex: 1;
      border: none;
      padding: 12px;
      border-radius: 11px;
      cursor: pointer;
      font-weight: bold;
    }

    .cancel-btn {
      background: #eee5f1;
      color: #694c72;
    }

    .save-btn {
      background: linear-gradient(135deg, #9b59b6, #c77dff);
      color: white;
    }

    .message {
      margin-top: 12px;
      padding: 10px;
      border-radius: 9px;
      display: none;
      font-size: 13px;
    }

    .message.success {
      display: block;
      background: #e1f7e9;
      color: #287343;
    }

    .message.error {
      display: block;
      background: #ffe5e8;
      color: #a13d4d;
    }

    .image-preview {
      margin-top: 10px;
      display: none;
      text-align: center;
    }

    .image-preview img {
      max-width: 180px;
      max-height: 120px;
      border-radius: 12px;
      object-fit: cover;
      border: 1px solid #e1cce8;
    }

    /* INVENTARIO */

    .account-card {
      background: #faf6ff;
      border: 1px solid #eadcf0;
      border-radius: 13px;
      padding: 13px;
      margin-bottom: 10px;
    }

    .account-card strong {
      color: #633a78;
    }

    .account-data {
      font-size: 12px;
      line-height: 1.6;
      margin-top: 7px;
      color: #68536e;
    }

    .account-actions {
      display: flex;
      gap: 7px;
      margin-top: 10px;
    }

    .account-actions button {
      flex: 1;
      border: none;
      border-radius: 8px;
      padding: 8px;
      cursor: pointer;
      font-size: 12px;
      font-weight: bold;
    }

    .account-edit {
      background: #e8ddff;
      color: #65418b;
    }

    .account-delete {
      background: #ffe1e5;
      color: #a03e4f;
    }

    .inventory-top {
      background: #f8f1ff;
      border-radius: 12px;
      padding: 13px;
      margin-bottom: 15px;
    }

    .inventory-top strong {
      color: #633a78;
    }

    .add-account-btn {
      width: 100%;
      border: none;
      padding: 11px;
      border-radius: 10px;
      cursor: pointer;
      background: linear-gradient(135deg, #9b59b6, #c77dff);
      color: white;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .no-accounts {
      text-align: center;
      color: #806b88;
      padding: 20px 5px;
      font-size: 13px;
    }

    @media (max-width: 650px) {
      .back-btn {
        position: static;
        margin-bottom: 10px;
      }

      header {
        padding: 15px;
      }

      .product-actions {
        flex-direction: column;
      }

      .modal-content {
        padding: 18px;
      }
    }
  </style>
</head>

<body>

<header>
  <button class="back-btn" onclick="window.location.href='admin.html'">
    ← Volver
  </button>

  <h1>🦋 Productos</h1>
  <p>Gestiona los productos de Butterfly Shop</p>
</header>

<div class="container">

  <div class="top-actions">
    <button class="primary-btn" onclick="abrirModalProducto()">
      ➕ Nuevo producto
    </button>
  </div>

  <div id="products-container" class="products-grid">
    <div class="loading">Cargando productos...</div>
  </div>

</div>


<!-- =========================
     MODAL NUEVO PRODUCTO
========================= -->

<div id="product-modal" class="modal">

  <div class="modal-content">

    <div class="modal-header">
      <h2>✨ Nuevo producto</h2>

      <button class="close-btn" onclick="cerrarModalProducto()">
        ×
      </button>
    </div>

    <form id="product-form">

      <div class="form-group">
        <label>Imagen del producto</label>

        <input
          type="file"
          id="product-image"
          accept="image/*"
        >

        <div id="product-image-preview" class="image-preview">
          <img id="product-image-preview-img" src="" alt="Vista previa">
        </div>
      </div>

      <div class="form-group">
        <label>Nombre del producto</label>

        <input
          type="text"
          id="product-name"
          placeholder="Ej. Netflix Perfil"
          required
        >
      </div>

      <div class="form-group">
        <label>Descripción</label>

        <textarea
          id="product-description"
          placeholder="Describe el producto..."
          required
        ></textarea>
      </div>

      <div class="form-group">
        <label>Precio en créditos</label>

        <input
          type="number"
          id="product-price"
          min="1"
          placeholder="Ej. 55"
          required
        >
      </div>

      <div class="form-group">
        <label>Categoría</label>

        <input
          type="text"
          id="product-category"
          placeholder="Ej. Streaming"
          required
        >
      </div>

      <div class="form-group">
        <label>Tipo de cuenta</label>

        <select id="product-account-type" required>
          <option value="Cuenta por perfil">
            Cuenta por perfil
          </option>

          <option value="Cuenta completa">
            Cuenta completa
          </option>
        </select>
      </div>

      <div class="checkbox-group">
        <input
          type="checkbox"
          id="product-active"
          checked
        >

        <label for="product-active">
          Producto activo
        </label>
      </div>

      <div id="product-message" class="message"></div>

      <div class="modal-actions">

        <button
          type="button"
          class="cancel-btn"
          onclick="cerrarModalProducto()"
        >
          Cancelar
        </button>

        <button
          type="submit"
          class="save-btn"
        >
          Guardar producto
        </button>

      </div>

    </form>

  </div>

</div>


<!-- =========================
     MODAL EDITAR PRODUCTO
========================= -->

<div id="edit-product-modal" class="modal">

  <div class="modal-content">

    <div class="modal-header">
      <h2>✏️ Editar producto</h2>

      <button
        class="close-btn"
        onclick="cerrarEditarProducto()"
      >
        ×
      </button>
    </div>

    <form id="edit-product-form">

      <div class="form-group">
        <label>Imagen del producto</label>

        <input
          type="file"
          id="edit-product-image"
          accept="image/*"
        >

        <div id="edit-product-image-preview" class="image-preview">
          <img
            id="edit-product-image-preview-img"
            src=""
            alt="Imagen actual"
          >
        </div>
      </div>

      <div class="form-group">
        <label>Nombre del producto</label>

        <input
          type="text"
          id="edit-product-name"
          required
        >
      </div>

      <div class="form-group">
        <label>Descripción</label>

        <textarea
          id="edit-product-description"
          required
        ></textarea>
      </div>

      <div class="form-group">
        <label>Precio en créditos</label>

        <input
          type="number"
          id="edit-product-price"
          min="1"
          required
        >
      </div>

      <div class="form-group">
        <label>Categoría</label>

        <input
          type="text"
          id="edit-product-category"
          required
        >
      </div>

      <div class="form-group">
        <label>Tipo de cuenta</label>

        <select id="edit-product-account-type" required>

          <option value="Cuenta por perfil">
            Cuenta por perfil
          </option>

          <option value="Cuenta completa">
            Cuenta completa
          </option>

        </select>
      </div>

      <div class="checkbox-group">

        <input
          type="checkbox"
          id="edit-product-active"
        >

        <label for="edit-product-active">
          Producto activo
        </label>

      </div>

      <div id="edit-product-message" class="message"></div>

      <div class="modal-actions">

        <button
          type="button"
          class="cancel-btn"
          onclick="cerrarEditarProducto()"
        >
          Cancelar
        </button>

        <button
          type="submit"
          class="save-btn"
          id="save-edit-product-btn"
        >
          Guardar cambios
        </button>

      </div>

    </form>

  </div>

</div>


<!-- =========================
     MODAL INVENTARIO
========================= -->

<div id="inventory-modal" class="modal">

  <div class="modal-content">

    <div class="modal-header">

      <h2 id="inventory-title">
        📦 Gestionar cuentas
      </h2>

      <button
        class="close-btn"
        onclick="cerrarInventario()"
      >
        ×
      </button>

    </div>

    <div class="inventory-top">

      <div>
        Producto:
        <strong id="inventory-product-name">
          -
        </strong>
      </div>

      <div style="margin-top:5px;">
        Disponibles:
        <strong id="inventory-count">
          0
        </strong>
      </div>

    </div>

    <button
      class="add-account-btn"
      onclick="abrirAgregarCuenta()"
    >
      ➕ Agregar cuenta
    </button>

    <div id="accounts-container">
      <div class="loading">
        Cargando cuentas...
      </div>
    </div>

  </div>

</div>


<!-- =========================
     MODAL AGREGAR / EDITAR CUENTA
========================= -->

<div id="edit-account-modal" class="modal">

  <div class="modal-content">

    <div class="modal-header">

      <h2 id="account-modal-title">
        ➕ Agregar cuenta
      </h2>

      <button
        class="close-btn"
        onclick="cerrarCuentaModal()"
      >
        ×
      </button>

    </div>

    <form id="account-form">

      <div class="form-group">

        <label>Email</label>

        <input
          type="email"
          id="account-email"
          placeholder="correo@ejemplo.com"
          required
        >

      </div>

      <div class="form-group">

        <label>Contraseña</label>

        <input
          type="text"
          id="account-password"
          placeholder="Contraseña"
          required
        >

      </div>

      <div class="form-group">

        <label>Perfil</label>

        <input
          type="text"
          id="account-profile"
          placeholder="Ej. Micte"
        >

      </div>

      <div class="form-group">

        <label>PIN</label>

        <input
          type="text"
          id="account-pin"
          placeholder="Ej. 1234"
        >

      </div>

      <div id="account-message" class="message"></div>

      <div class="modal-actions">

        <button
          type="button"
          class="cancel-btn"
          onclick="cerrarCuentaModal()"
        >
          Cancelar
        </button>

        <button
          type="submit"
          class="save-btn"
        >
          Guardar
        </button>

      </div>

    </form>

  </div>

</div>


<script>

  let productosCargados = [];
  let productoEditandoActual = null;

  let productoInventarioActual = null;
  let cuentaEditandoActual = null;


  /* =========================================
     COMPROBAR ADMIN
  ========================================= */

  async function comprobarAdministrador() {

    const {
      data: { user },
      error
    } = await supabaseClient.auth.getUser();

    if (error || !user) {

      window.location.href = "login.html";
      return false;
    }

    const { data: perfil, error: perfilError } =
      await supabaseClient
        .from("profiles")
        .select("role")
        .eq("id", user.id)
        .single();

    if (
      perfilError ||
      !perfil ||
      perfil.role !== "admin"
    ) {

      alert("No tienes permisos de administrador.");
      window.location.href = "panel.html";
      return false;
    }

    return true;
  }


  /* =========================================
     CARGAR PRODUCTOS
  ========================================= */

  async function cargarProductos() {

    const container =
      document.getElementById("products-container");

    container.innerHTML =
      '<div class="loading">Cargando productos...</div>';

    const {
      data,
      error
    } = await supabaseClient
      .from("products")
      .select("*")
      .order("created_at", {
        ascending: false
      });

    if (error) {

      console.error(error);

      container.innerHTML = `
        <div class="empty">
          ❌ No se pudieron cargar los productos.
        </div>
      `;

      return;
    }

    productosCargados = data || [];

    if (!productosCargados.length) {

      container.innerHTML = `
        <div class="empty">
          🦋 No hay productos registrados.
        </div>
      `;

      return;
    }

    container.innerHTML = "";

    for (const producto of productosCargados) {

      const {
        data: cuentas,
        error: cuentasError
      } = await supabaseClient
        .from("product_accounts")
        .select("id, status")
        .eq("product_id", producto.id);

      let disponibles = 0;
      let vendidas = 0;

      if (!cuentasError && cuentas) {

        disponibles =
          cuentas.filter(
            cuenta => cuenta.status === "available"
          ).length;

        vendidas =
          cuentas.filter(
            cuenta => cuenta.status === "sold"
          ).length;
      }

      const imagen =
        producto.image_url ||
        "https://placehold.co/600x400/f3eaff/70418b?text=Butterfly+Shop";

      const estadoBadge = producto.active
        ? `<span class="badge badge-active">🟢 Activo</span>`
        : `<span class="badge badge-inactive">⚪ Inactivo</span>`;

      const card = document.createElement("div");

      card.className = "product-card";

      card.innerHTML = `

        <img
          src="${imagen}"
          class="product-image"
          alt="${escapeHtml(producto.name || "Producto")}"
        >

        <div class="product-content">

          <div class="product-name">
            ${escapeHtml(producto.name || "Sin nombre")}
          </div>

          <div class="product-description">
            ${escapeHtml(producto.description || "Sin descripción")}
          </div>

          <div class="product-info">

            <span class="badge badge-price">
              💰 ${producto.price_credits} créditos
            </span>

            <span class="badge">
              📂 ${escapeHtml(producto.category || "Sin categoría")}
            </span>

            <span class="badge">
              👤 ${escapeHtml(producto.account_type || "Sin tipo")}
            </span>

            ${estadoBadge}

          </div>

          <div class="inventory-summary">

            📦 Disponibles:
            <strong>${disponibles}</strong>

            &nbsp; | &nbsp;

            🛒 Vendidas:
            <strong>${vendidas}</strong>

          </div>

          <div class="product-actions">

            <button
              type="button"
              class="edit-product-btn"
              onclick="abrirEditarProducto('${producto.id}')"
            >
              ✏️ Editar producto
            </button>

            <button
              type="button"
              class="inventory-btn"
              onclick="abrirInventario(
                '${producto.id}',
                '${escapeHtml(producto.name || "Producto").replace(/'/g, "\\'")}'
              )"
            >
              📦 Gestionar cuentas
            </button>

          </div>

        </div>
      `;

      container.appendChild(card);
    }
  }


  /* =========================================
     ESCAPAR HTML
  ========================================= */

  function escapeHtml(text) {

    if (text === null || text === undefined) {
      return "";
    }

    return String(text)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }


  /* =========================================
     NUEVO PRODUCTO
  ========================================= */

  function abrirModalProducto() {

    document.getElementById("product-modal").style.display =
      "flex";

    document.getElementById("product-form").reset();

    document.getElementById("product-active").checked =
      true;

    ocultarMensaje("product-message");

    document.getElementById(
      "product-image-preview"
    ).style.display = "none";
  }


  function cerrarModalProducto() {

    document.getElementById("product-modal").style.display =
      "none";
  }


  /* =========================================
     PREVIEW NUEVO PRODUCTO
  ========================================= */

  document
    .getElementById("product-image")
    .addEventListener("change", function() {

      const file = this.files[0];

      const preview =
        document.getElementById(
          "product-image-preview"
        );

      const image =
        document.getElementById(
          "product-image-preview-img"
        );

      if (!file) {

        preview.style.display = "none";
        return;
      }

      const reader = new FileReader();

      reader.onload = function(e) {

        image.src = e.target.result;
        preview.style.display = "block";
      };

      reader.readAsDataURL(file);
    });


  /* =========================================
     CREAR PRODUCTO
  ========================================= */

  document
    .getElementById("product-form")
    .addEventListener("submit", async function(event) {

      event.preventDefault();

      const name =
        document.getElementById(
          "product-name"
        ).value.trim();

      const description =
        document.getElementById(
          "product-description"
        ).value.trim();

      const price =
        Number(
          document.getElementById(
            "product-price"
          ).value
        );

      const category =
        document.getElementById(
          "product-category"
        ).value.trim();

      const accountType =
        document.getElementById(
          "product-account-type"
        ).value;

      const active =
        document.getElementById(
          "product-active"
        ).checked;

      const imageFile =
        document.getElementById(
          "product-image"
        ).files[0];

      const message =
        document.getElementById(
          "product-message"
        );

      ocultarMensaje("product-message");

      if (!name || !description || !category) {

        mostrarMensaje(
          "product-message",
          "Completa todos los campos obligatorios.",
          "error"
        );

        return;
      }

      if (!price || price < 1) {

        mostrarMensaje(
          "product-message",
          "El precio debe ser mayor a 0.",
          "error"
        );

        return;
      }

      let imageUrl = null;

      if (imageFile) {

        const extension =
          imageFile.name
            .split(".")
            .pop()
            .toLowerCase();

        const fileName =
          `product-${Date.now()}-${Math.random()
            .toString(36)
            .substring(2)}.${extension}`;

        const {
          error: uploadError
        } = await supabaseClient.storage
          .from("product-images")
          .upload(
            fileName,
            imageFile
          );

        if (uploadError) {

          console.error(uploadError);

          mostrarMensaje(
            "product-message",
            "No se pudo subir la imagen.",
            "error"
          );

          return;
        }

        const {
          data: publicUrlData
        } = supabaseClient.storage
          .from("product-images")
          .getPublicUrl(fileName);

        imageUrl =
          publicUrlData.publicUrl;
      }

      const {
        error
      } = await supabaseClient
        .from("products")
        .insert({

          name,
          description,
          price_credits: price,
          category,
          account_type: accountType,
          active,
          image_url: imageUrl

        });

      if (error) {

        console.error(error);

        mostrarMensaje(
          "product-message",
          "No se pudo crear el producto: " +
          error.message,
          "error"
        );

        return;
      }

      mostrarMensaje(
        "product-message",
        "✨ Producto creado correctamente.",
        "success"
      );

      await cargarProductos();

      setTimeout(() => {

        cerrarModalProducto();

      }, 900);

    });

     EDITAR PRODUCTO

    document.getElementById(
      "edit-product-price"

    document.getElementById(
      "edit-product-category"
    ).value =

  /* =========================================
     PREVIEW IMAGEN EDITAR

  document
    .getElementById("edit-product-image")

  /* =========================================
     GUARDAR EDICIÓN
  ========================================= */

  document
    .getElementById("edit-product-form")
    .addEventListener("submit", async function(event) {

      event.preventDefault();

      if (!productoEditandoActual) {

        mostrarMensaje(
          "edit-product-message",
          "No hay ningún producto seleccionado.",
          "error"
        );

        return;
      }

      const name =
        document.getElementById(
          "edit-product-name"
        ).value.trim();

      const description =
        document.getElementById(
          "edit-product-description"
        ).value.trim();

      const price =
        Number(
          document.getElementById(
            "edit-product-price"
          ).value
        );

      const category =
        document.getElementById(
          "edit-product-category"
        ).value.trim();

      const accountType =
        document.getElementById(
          "edit-product-account-type"
        ).value;

      const active =
        document.getElementById(
          "edit-product-active"
        ).checked;

      const imageFile =
        document.getElementById(
          "edit-product-image"
        ).files[0];

      if (!name || !description || !category) {

        mostrarMensaje(
          "edit-product-message",
          "Completa todos los campos obligatorios.",
          "error"
        );

        return;
      }

      if (!price || price < 1) {

        mostrarMensaje(
          "edit-product-message",
          "El precio debe ser mayor a 0.",
          "error"
        );

        return;
      }

      const saveButton =
        document.getElementById(
          "save-edit-product-btn"
        );

      saveButton.disabled = true;
      saveButton.textContent =
        "Guardando...";

      let imageUrl =
        productoEditandoActual.image_url ||
        null;


      /* SUBIR NUEVA IMAGEN */

      if (imageFile) {

        const extension =
          imageFile.name
            .split(".")
            .pop()
            .toLowerCase();

        const fileName =
          `product-edit-${Date.now()}-${Math.random()
            .toString(36)
            .substring(2)}.${extension}`;

        const {
          error: uploadError
        } = await supabaseClient.storage
          .from("product-images")
          .upload(
            fileName,
            imageFile
          );

        if (uploadError) {

          console.error(uploadError);

          saveButton.disabled = false;
          saveButton.textContent =
            "Guardar cambios";

          mostrarMensaje(
            "edit-product-message",
            "No se pudo subir la nueva imagen.",
            "error"
          );

          return;
        }

        const {
          data: publicUrlData
        } = supabaseClient.storage
          .from("product-images")
          .getPublicUrl(fileName);

        imageUrl =
          publicUrlData.publicUrl;
      }


      /* ACTUALIZAR MEDIANTE RPC */

      const {
        data,
        error
      } = await supabaseClient.rpc(
        "update_product",
        {
          p_product_id:
            productoEditandoActual.id,

          p_name:
            name,

          p_description:
            description,

          p_price_credits:
            price,

          p_category:
            category,

          p_account_type:
            accountType,

          p_active:
            active,

          p_image_url:
            imageUrl
        }
      );


      saveButton.disabled = false;
      saveButton.textContent =
        "Guardar cambios";


      if (error) {

        console.error(error);

        mostrarMensaje(
          "edit-product-message",
          "No se pudo actualizar el producto: " +
          error.message,
          "error"
        );

        return;
      }


      if (
        data &&
        data.success === false
      ) {

        mostrarMensaje(
          "edit-product-message",
          data.message ||
          "No se pudo actualizar el producto.",
          "error"
        );

        return;
      }


      mostrarMensaje(
        "edit-product-message",
        "✨ Producto actualizado correctamente.",
        "success"
      );


      await cargarProductos();


      setTimeout(() => {

        cerrarEditarProducto();

      }, 900);

    });


  /* =========================================
     INVENTARIO

  async function abrirInventario(
    productId,
    productName
  ) {

    productoInventarioActual =
      productId;

    document.getElementById(
      "inventory-product-name"
    ).textContent =
      productName;

    document.getElementById(
      "inventory-modal"
    ).style.display = "flex";

    await cargarCuentasProducto();
  }


  function cerrarInventario() {

    document.getElementById(
      "inventory-modal"
    ).style.display = "none";

    productoInventarioActual = null;
  }


  async function cargarCuentasProducto() {

    const container =
      document.getElementById(
        "accounts-container"
      );

    container.innerHTML =
      '<div class="loading">Cargando cuentas...</div>';

    const {
      data,
      error
    } = await supabaseClient
      .from("product_accounts")
      .select("*")
      .eq(
        "product_id",
        productoInventarioActual
      )
      .order("created_at", {
        ascending: false
      });

    if (error) {

      console.error(error);

      container.innerHTML = `
        <div class="no-accounts">
          ❌ No se pudieron cargar las cuentas.
        </div>
      `;

      return;
    }

    const disponibles =
      (data || []).filter(
        cuenta =>
          cuenta.status === "available"
      ).length;

    document.getElementById(
      "inventory-count"
    ).textContent =
      disponibles;


    if (!data || !data.length) {

      container.innerHTML = `
        <div class="no-accounts">
          📦 No hay cuentas cargadas todavía.
        </div>
      `;

      return;
    }


    container.innerHTML = "";

    data.forEach(cuenta => {

      const card =
        document.createElement("div");

      card.className =
        "account-card";

      const statusText =
        cuenta.status === "available"
          ? "🟢 Disponible"
          : cuenta.status === "sold"
            ? "🔴 Vendida"
            : "⚪ " + cuenta.status;

      card.innerHTML = `

        <strong>
          ${escapeHtml(
            cuenta.email ||
            "Sin email"
          )}
        </strong>

        <div class="account-data">

          🔑 Contraseña:
          ${escapeHtml(
            cuenta.password ||
            "No registrada"
          )}

          <br>

          👤 Perfil:
          ${escapeHtml(
            cuenta.profile_name ||
            "No especificado"
          )}

          <br>

          🔢 PIN:
          ${escapeHtml(
            cuenta.pin ||
            "No especificado"
          )}

          <br>

          📌 Estado:
          ${statusText}

        </div>

        <div class="account-actions">

          <button
            class="account-edit"
            onclick="abrirEditarCuenta('${cuenta.id}')"
          >
            ✏️ Editar
          </button>

          <button
            class="account-delete"
            onclick="eliminarCuenta('${cuenta.id}')"
          >
            🗑️ Eliminar
          </button>

        </div>
      `;

      container.appendChild(card);
    });
  }

  /* =========================================
     EDITAR CUENTA

  async function abrirEditarCuenta(
    accountId
  ) {

    const {
      data,
      error
    } = await supabaseClient
      .from("product_accounts")
      .select("*")
      .eq("id", accountId)
      .single();

    if (error || !data) {

      alert(
        "No se pudo cargar la cuenta."
      );

      return;
    }

      data;

    document.getElementById(
      "account-modal-title"
    ).textContent =
      "✏️ Editar cuenta";

    document.getElementById(
      "account-email"
    ).value =
      data.email || "";

    document.getElementById(
      "account-password"
    ).value =
      data.password || "";

    document.getElementById(
      "account-profile"
    ).value =
      data.profile_name || "";

    document.getElementById(
      "account-pin"
    ).value =
      data.pin || "";

    ocultarMensaje(
      "account-message"
    );

    document.getElementById(
      "edit-account-modal"
    ).style.display = "flex";

  /* =========================================
     GUARDAR CUENTA
  ========================================= */

  document
    .getElementById("account-form")
    .addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();

        const email =
          document.getElementById(
            "account-email"
          ).value.trim();

        const password =
          document.getElementById(
            "account-password"
          ).value.trim();

        const profile =
          document.getElementById(
            "account-profile"
          ).value.trim();

        const pin =
          document.getElementById(
            "account-pin"
          ).value.trim();

        if (!email || !password) {

          mostrarMensaje(
            "account-message",
            "Email y contraseña son obligatorios.",
            "error"
          );

          return;
        }


        if (cuentaEditandoActual) {

          const {
            error
          } = await supabaseClient.rpc(
            "update_product_account",
            {
              p_account_id:
                cuentaEditandoActual.id,

              p_email:
                email,

              p_password:
                password,

              p_profile_name:
                profile,

              p_pin:
                pin
            }
          );

          if (error) {

            console.error(error);

            mostrarMensaje(
              "account-message",
              "No se pudo actualizar la cuenta: " +
              error.message,
              "error"
            );

            return;
          }

          mostrarMensaje(
            "account-message",
            "✨ Cuenta actualizada correctamente.",
            "success"
          );

        } else {

          const {
            error
          } = await supabaseClient
            .from("product_accounts")
            .insert({

              product_id:
                productoInventarioActual,

              email,

              password,

              profile_name:
                profile || null,

              pin:
                pin || null,

              status:
                "available"

            });

          if (error) {

            console.error(error);

            mostrarMensaje(
              "account-message",
              "No se pudo agregar la cuenta: " +
              error.message,
              "error"
            );

            return;
          }

          mostrarMensaje(
            "account-message",
            "✨ Cuenta agregada correctamente.",
            "success"
          );
        }


        await cargarProductos();

        await cargarCuentasProducto();


        setTimeout(() => {

          cerrarCuentaModal();

        }, 800);

      }
    );


  /* =========================================
     ELIMINAR CUENTA
  ========================================= */

  async function eliminarCuenta(
    accountId
  ) {

    const confirmar =
      confirm(
        "¿Seguro que quieres eliminar esta cuenta?"
      );

    if (!confirmar) {
      return;
    }

    const {
      error
    } = await supabaseClient.rpc(
      "delete_product_account",
      {
        p_account_id:
          accountId
      }
    );

    if (error) {

      console.error(error);

      alert(
        "No se pudo eliminar la cuenta: " +
        error.message
      );

      return;
    }

    await cargarProductos();

    await cargarCuentasProducto();
  }


  /* =========================================
     MENSAJES
  ========================================= */

  function mostrarMensaje(
    id,
    texto,
    tipo
  ) {

    const element =
      document.getElementById(id);

    element.textContent =
      texto;

    element.className =
      "message " + tipo;
  }


  function ocultarMensaje(id) {

    const element =
      document.getElementById(id);

    element.textContent = "";

    element.className =
      "message";
  }


  /* =========================================
     CERRAR MODALES AL TOCAR AFUERA
  ========================================= */

  window.addEventListener(
    "click",
    function(event) {

      const modales = [
        "product-modal",
        "edit-product-modal",
        "inventory-modal",
        "edit-account-modal"
      ];

      modales.forEach(id => {

        const modal =
          document.getElementById(id);

        if (event.target === modal) {

          modal.style.display =

        }

  );

  async function iniciar() {

    const esAdmin =
      await comprobarAdministrador();

    if (!esAdmin) {
      return;
    }

    await cargarProductos();
  }


  iniciar();
