<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Butterfly Shop | Productos</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #faf7ff;
      color: #33243f;
    }

    header {
      background: linear-gradient(135deg, #b98cff, #e7a8d8);
      color: white;
      padding: 20px;
      box-shadow: 0 4px 15px #b98cff55;
    }

    .header-content {
      max-width: 1200px;
      margin: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
    }

    .back-btn {
      text-decoration: none;
      background: #ffffff33;
      color: white;
      padding: 9px 14px;
      border-radius: 12px;
      font-weight: bold;
      font-size: 14px;
    }

    .back-btn:hover {
      background: #ffffff55;
    }

    .container {
      max-width: 1200px;
      margin: 30px auto;
      padding: 0 18px;
    }

    .welcome {
      margin-bottom: 25px;
    }

    .welcome h1 {
      color: #743d91;
      margin-bottom: 8px;
    }

    .welcome p {
      color: #77677f;
    }

    .products-box {
      background: white;
      border: 1px solid #eadcff;
      border-radius: 18px;
      padding: 25px;
      box-shadow: 0 5px 18px #8d5ca515;
    }

    .products-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin-bottom: 20px;
    }

    .products-header h2 {
      color: #66377f;
    }

    .btn {
      border: none;
      cursor: pointer;
      background: linear-gradient(135deg, #9b6de3, #d98bc9);
      color: white;
      padding: 10px 15px;
      border-radius: 12px;
      font-weight: bold;
      font-size: 14px;
    }

    .btn:hover {
      opacity: 0.9;
    }

    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 18px;
    }

    .product-card {
      border: 1px solid #eadcff;
      border-radius: 16px;
      padding: 18px;
      background: #fcf9ff;
      overflow: hidden;
    }

    .product-image {
      width: 100%;
      height: 180px;
      object-fit: cover;
      border-radius: 13px;
      margin-bottom: 15px;
      background: #f1e9ff;
      display: block;
    }

    .no-image {
      width: 100%;
      height: 180px;
      border-radius: 13px;
      margin-bottom: 15px;
      background: linear-gradient(135deg, #f1e9ff, #fce8f7);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #9a7cab;
      font-size: 45px;
    }

    .product-card h3 {
      color: #743d91;
      margin-bottom: 8px;
      font-size: 20px;
    }

    .product-description {
      color: #77677f;
      margin-bottom: 15px;
      line-height: 1.5;
    }

    .product-info {
      display: flex;
      flex-direction: column;
      gap: 7px;
      margin-bottom: 12px;
      font-size: 14px;
    }

    .price {
      color: #8a4db0;
      font-weight: bold;
      font-size: 17px;
    }

    .active {
      color: #2e8b57;
      font-weight: bold;
    }

    .inactive {
      color: #b34d4d;
      font-weight: bold;
    }

    .empty-message {
      text-align: center;
      color: #8a7b91;
      padding: 40px 15px;
    }

    .error-message {
      text-align: center;
      color: #b34d4d;
      background: #fff0f0;
      border: 1px solid #f0cccc;
      padding: 20px;
      border-radius: 12px;
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: #00000066;
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal.active {
      display: flex;
    }

    .modal-content {
      background: white;
      width: 100%;
      max-width: 550px;
      max-height: 90vh;
      overflow-y: auto;
      border-radius: 20px;
      padding: 25px;
      box-shadow: 0 10px 40px #00000033;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      gap: 10px;
    }

    .modal-header h2 {
      color: #743d91;
    }

    .close-btn {
      border: none;
      background: #f1e8f7;
      color: #743d91;
      width: 35px;
      height: 35px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 20px;
      font-weight: bold;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      margin-bottom: 7px;
      color: #66377f;
      font-weight: bold;
      font-size: 14px;
    }

    .form-group input,
    .form-group textarea,
    .form-group select {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid #dcc8eb;
      border-radius: 11px;
      outline: none;
      color: #33243f;
      background: #fff;
      font-size: 14px;
    }

    .form-group input:focus,
    .form-group textarea:focus,
    .form-group select:focus {
      border-color: #a875d7;
      box-shadow: 0 0 0 3px #a875d722;
    }

    .form-group textarea {
      min-height: 90px;
      resize: vertical;
    }

    .image-preview {
      display: none;
      width: 100%;
      height: 200px;
      object-fit: cover;
      border-radius: 14px;
      margin-top: 10px;
      border: 1px solid #eadcff;
    }

    .upload-box {
      border: 2px dashed #d5b9e8;
      border-radius: 14px;
      padding: 20px;
      text-align: center;
      background: #fcf8ff;
    }

    .upload-box p {
      color: #806d89;
      font-size: 13px;
      margin-top: 7px;
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      margin-top: 22px;
    }

    .modal-actions button {
      flex: 1;
    }

    .cancel-btn {
      border: none;
      cursor: pointer;
      background: #eee7f2;
      color: #60476d;
      padding: 11px 15px;
      border-radius: 12px;
      font-weight: bold;
    }

    .save-btn {
      border: none;
      cursor: pointer;
      background: linear-gradient(135deg, #9b6de3, #d98bc9);
      color: white;
      padding: 11px 15px;
      border-radius: 12px;
      font-weight: bold;
    }

    .save-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .status-message {
      margin-top: 15px;
      padding: 11px;
      border-radius: 10px;
      text-align: center;
      display: none;
      font-size: 14px;
      line-height: 1.5;
      word-break: break-word;
    }

    .status-success {
      display: block;
      background: #eaf8ef;
      color: #267446;
      border: 1px solid #bfe4ca;
    }

    .status-error {
      display: block;
      background: #fff0f0;
      color: #a33f3f;
      border: 1px solid #efc7c7;
    }

    @media (max-width: 600px) {

      .header-content {
        flex-direction: column;
        text-align: center;
      }

      .products-header {
        flex-direction: column;
        align-items: stretch;
      }

      .products-header .btn {
        width: 100%;
      }

      .modal-content {
        padding: 20px;
      }

      .modal-actions {
        flex-direction: column;
      }
    }
  </style>
</head>

<body>

  <header>

    <div class="header-content">

      <div class="logo">
        🦋 Butterfly Shop
      </div>

      <a href="admin.html" class="back-btn">
        ← Volver al panel
      </a>

    </div>

  </header>


  <main class="container">

    <div class="welcome">

      <h1>
        🛍️ Gestionar productos
      </h1>

      <p>
        Crea, modifica, activa o desactiva los productos de Butterfly Shop.
      </p>

    </div>


    <div class="products-box">

      <div class="products-header">

        <h2>
          🦋 Productos de la tienda
        </h2>

        <button class="btn" onclick="crearProducto()">
          ➕ Nuevo producto
        </button>

      </div>


      <div id="products-container">

        <div class="empty-message">
          🦋✨ Cargando productos...
        </div>

      </div>

    </div>

  </main>


  <!-- MODAL NUEVO PRODUCTO -->

  <div id="product-modal" class="modal">

    <div class="modal-content">

      <div class="modal-header">

        <h2>
          🦋 Nuevo producto
        </h2>

        <button class="close-btn" onclick="cerrarModal()">
          ×
        </button>

      </div>


      <form id="product-form">

        <div class="form-group">

          <label>
            🖼️ Imagen del producto
          </label>

          <div class="upload-box">

            <input
              type="file"
              id="product-image"
              accept="image/*"
            >

            <p>
              Selecciona una imagen desde tu dispositivo.
            </p>

          </div>

          <img
            id="image-preview"
            class="image-preview"
            alt="Vista previa"
          >

        </div>


        <div class="form-group">

          <label for="product-name">
            🏷️ Nombre del producto
          </label>

          <input
            type="text"
            id="product-name"
            placeholder="Ej. Netflix"
            required
          >

        </div>


        <div class="form-group">

          <label for="product-description">
            📝 Descripción
          </label>

          <textarea
            id="product-description"
            placeholder="Describe el producto..."
            required
          ></textarea>

        </div>


        <div class="form-group">

          <label for="product-price">
            💎 Precio en créditos
          </label>

          <input
            type="number"
            id="product-price"
            min="1"
            step="1"
            placeholder="Ej. 50"
            required
          >

        </div>


        <div class="form-group">

          <label for="product-category">
            🏷️ Categoría
          </label>

          <input
            type="text"
            id="product-category"
            placeholder="Ej. Streaming"
            required
          >

        </div>


        <div class="form-group">

          <label for="product-active">
            🟢 Estado
          </label>

          <select id="product-active">

            <option value="true">
              🟢 Activo
            </option>

            <option value="false">
              🔴 Inactivo
            </option>

          </select>

        </div>


        <div
          id="status-message"
          class="status-message"
        ></div>


        <div class="modal-actions">

          <button
            type="button"
            class="cancel-btn"
            onclick="cerrarModal()"
          >
            Cancelar
          </button>

          <button
            type="submit"
            class="save-btn"
            id="save-product-btn"
          >
            💾 Crear producto
          </button>

        </div>

      </form>

    </div>

  </div>


  <!-- Supabase -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Configuración -->

  <script src="supabase-config.js"></script>


  <script>

    const modal = document.getElementById("product-modal");
    const form = document.getElementById("product-form");
    const imageInput = document.getElementById("product-image");
    const imagePreview = document.getElementById("image-preview");
    const statusMessage = document.getElementById("status-message");
    const saveButton = document.getElementById("save-product-btn");


    /*
      ============================================================
      MOSTRAR MENSAJE
      ============================================================
    */

    function mostrarError(mensaje) {

      statusMessage.className =
        "status-message status-error";

      statusMessage.textContent =
        "❌ " + mensaje;

    }


    function mostrarExito(mensaje) {

      statusMessage.className =
        "status-message status-success";

      statusMessage.textContent =
        mensaje;

    }


    /*
      ============================================================
      ABRIR / CERRAR MODAL
      ============================================================
    */

    function crearProducto() {

      form.reset();

      imagePreview.style.display = "none";
      imagePreview.src = "";

      statusMessage.className = "status-message";
      statusMessage.textContent = "";

      modal.classList.add("active");

    }


    function cerrarModal() {

      modal.classList.remove("active");

      form.reset();

      imagePreview.style.display = "none";
      imagePreview.src = "";

      statusMessage.className = "status-message";
      statusMessage.textContent = "";

    }


    /*
      ============================================================
      VISTA PREVIA DE IMAGEN
      ============================================================
    */

    imageInput.addEventListener("change", () => {

      const file = imageInput.files[0];

      if (!file) {

        imagePreview.style.display = "none";
        imagePreview.src = "";

        return;

      }


      if (!file.type.startsWith("image/")) {

        alert("🦋 Selecciona un archivo de imagen.");

        imageInput.value = "";

        return;

      }


      const reader = new FileReader();

      reader.onload = (event) => {

        imagePreview.src = event.target.result;

        imagePreview.style.display = "block";

      };

      reader.readAsDataURL(file);

    });


    /*
      ============================================================
      COMPROBAR SESIÓN Y ADMIN
      ============================================================
    */

    async function comprobarAdministrador() {

      const {
        data: { user },
        error: userError
      } = await supabaseClient.auth.getUser();


      if (userError) {

        console.error(
          "Error obteniendo usuario:",
          userError
        );

        throw new Error(
          "No se pudo comprobar la sesión de administrador."
        );

      }


      if (!user) {

        throw new Error(
          "No hay una sesión iniciada. Vuelve a iniciar sesión."
        );

      }


      console.log("Usuario autenticado:", user.id);


      const {
        data: profile,
        error: profileError
      } = await supabaseClient
        .from("profiles")
        .select("id, role")
        .eq("id", user.id)
        .maybeSingle();


      if (profileError) {

        console.error(
          "Error obteniendo perfil:",
          profileError
        );

        throw new Error(
          "No se pudo comprobar el perfil del administrador."
        );

      }


      if (!profile) {

        throw new Error(
          "Tu usuario no tiene un perfil registrado."
        );

      }


      console.log(
        "Perfil encontrado:",
        profile
      );


      if (profile.role !== "admin") {

        throw new Error(
          "Tu cuenta no tiene permisos de administrador."
        );

      }


      return user;

    }


    /*
      ============================================================
      CREAR PRODUCTO
      ============================================================
    */

    form.addEventListener("submit", async (event) => {

      event.preventDefault();


      saveButton.disabled = true;

      saveButton.textContent =
        "⏳ Creando...";


      statusMessage.className =
        "status-message";

      statusMessage.textContent =
        "";


      try {

        /*
          --------------------------------------------------------
          1. COMPROBAR QUE HAY ADMIN AUTENTICADO
          --------------------------------------------------------
        */

        const user =
          await comprobarAdministrador();


        console.log(
          "Admin autorizado para crear producto:",
          user.id
        );


        /*
          --------------------------------------------------------
          2. OBTENER DATOS DEL FORMULARIO
          --------------------------------------------------------
        */

        const name =
          document
            .getElementById("product-name")
            .value
            .trim();


        const description =
          document
            .getElementById("product-description")
            .value
            .trim();


        const price =
          Number(
            document
              .getElementById("product-price")
              .value
          );


        const category =
          document
            .getElementById("product-category")
            .value
            .trim();


        const active =
          document
            .getElementById("product-active")
            .value === "true";


        const imageFile =
          imageInput.files[0];


        /*
          --------------------------------------------------------
          3. VALIDAR DATOS
          --------------------------------------------------------
        */

        if (
          !name ||
          !description ||
          !price ||
          !category
        ) {

          throw new Error(
            "Completa todos los campos del producto."
          );

        }


        /*
          --------------------------------------------------------
          4. SUBIR IMAGEN
          --------------------------------------------------------
        */

        let imageUrl = null;


        if (imageFile) {

          console.log(
            "Subiendo imagen:",
            imageFile.name
          );


          const extension =
            imageFile.name
              .split(".")
              .pop()
              .toLowerCase();


          const safeName =
            name
              .toLowerCase()
              .replace(/[^a-z0-9]+/g, "-")
              .replace(/^-|-$/g, "");


          const fileName =
            `${Date.now()}-${safeName}.${extension}`;


          const {
            error: uploadError
          } =
            await supabaseClient.storage
              .from("product-images")
              .upload(
                fileName,
                imageFile,
                {
                  cacheControl: "3600",
                  upsert: false
                }
              );


          if (uploadError) {

            console.error(
              "ERROR AL SUBIR IMAGEN:",
              uploadError
            );


            throw new Error(
              `Error al subir la imagen. ` +
              `Código: ${uploadError.statusCode || "sin código"} | ` +
              `Mensaje: ${uploadError.message || "sin mensaje"}`
            );

          }


          console.log(
            "Imagen subida correctamente:",
            fileName
          );


          const {
            data: publicUrlData
          } =
            supabaseClient.storage
              .from("product-images")
              .getPublicUrl(fileName);


          imageUrl =
            publicUrlData.publicUrl;


          console.log(
            "URL pública de imagen:",
            imageUrl
          );

        }


        /*
          --------------------------------------------------------
          5. INSERTAR PRODUCTO EN SUPABASE
          --------------------------------------------------------
        */

        console.log(
          "Intentando insertar producto..."
        );


        const {
          data: insertedProduct,
          error: insertError
        } =
          await supabaseClient
            .from("products")
            .insert([
              {
                name: name,
                descripción: description,
                price_credits: price,
                categoria: category,
                active: active,
                image_url: imageUrl
              }
            ])
            .select()
            .single();


        /*
          --------------------------------------------------------
          6. MOSTRAR ERROR COMPLETO DE SUPABASE
          --------------------------------------------------------
        */

        if (insertError) {

          console.error(
            "================================"
          );

          console.error(
            "ERROR COMPLETO DEL INSERT:"
          );

          console.error(
            "Código:",
            insertError.code
          );

          console.error(
            "Mensaje:",
            insertError.message
          );

          console.error(
            "Detalles:",
            insertError.details
          );

          console.error(
            "Hint:",
            insertError.hint
          );

          console.error(
            "Error completo:",
            insertError
          );

          console.error(
            "================================"
          );


          throw new Error(
            `Código: ${insertError.code || "sin código"} | ` +
            `Mensaje: ${insertError.message || "sin mensaje"} | ` +
            `Detalles: ${insertError.details || "sin detalles"} | ` +
            `Hint: ${insertError.hint || "sin hint"}`
          );

        }


        console.log(
          "Producto creado:",
          insertedProduct
        );


        /*
          --------------------------------------------------------
          7. ÉXITO
          --------------------------------------------------------
        */

        mostrarExito(
          "🦋✨ ¡Producto creado correctamente!"
        );


        await cargarProductos();


        setTimeout(() => {

          cerrarModal();

        }, 1000);


      } catch (error) {

        console.error(
          "================================"
        );

        console.error(
          "ERROR AL CREAR PRODUCTO:"
        );

        console.error(
          error
        );

        console.error(
          "================================"
        );


        mostrarError(
          error.message ||
          "No se pudo crear el producto."
        );

      }


      saveButton.disabled = false;

      saveButton.textContent =
        "💾 Crear producto";

    });


    /*
      ============================================================
      CARGAR PRODUCTOS
      ============================================================
    */

    async function cargarProductos() {

      const container =
        document.getElementById(
          "products-container"
        );


      container.innerHTML = `

        <div class="empty-message">

          🦋✨ Cargando productos...

        </div>

      `;


      const {
        data,
        error
      } =
        await supabaseClient
          .from("products")
          .select("*");


      if (error) {

        console.error(
          "Error al cargar productos:",
          error
        );


        container.innerHTML = `

          <div class="error-message">

            ❌ No se pudieron cargar los productos.

            <br><br>

            ${error.message}

          </div>

        `;

        return;

      }


      if (!data || data.length === 0) {

        container.innerHTML = `

          <div class="empty-message">

            🦋✨ Aún no hay productos cargados.

            <br><br>

            Puedes crear el primero usando

            <strong>➕ Nuevo producto</strong>.

          </div>

        `;

        return;

      }


      container.innerHTML = `

        <div class="products-grid">

          ${data.map(producto => `

            <div class="product-card">

              ${
                producto.image_url

                  ? `

                    <img
                      src="${producto.image_url}"
                      class="product-image"
                      alt="${producto.name ?? "Producto"}"
                    >

                  `

                  : `

                    <div class="no-image">
                      🦋
                    </div>

                  `
              }


              <h3>
                ${producto.name ?? "Sin nombre"}
              </h3>


              <div class="product-description">
                ${producto.descripción ?? "Sin descripción"}
              </div>


              <div class="product-info">

                <div class="price">
                  💎 ${producto.price_credits ?? 0} créditos
                </div>


                <div>
                  🏷️ Categoría:
                  ${producto.categoria ?? "Sin categoría"}
                </div>


                <div>
                  🆔 ID:
                  ${producto.id ?? "Sin ID"}
                </div>


                <div>

                  ${
                    producto.active

                      ? `<span class="active">🟢 Activo</span>`

                      : `<span class="inactive">🔴 Inactivo</span>`
                  }

                </div>

              </div>

            </div>

          `).join("")}

        </div>

      `;

    }


    /*
      ============================================================
      COMPROBAR ACCESO AL ABRIR LA PÁGINA
      ============================================================
    */

    async function iniciarPagina() {

      try {

        await comprobarAdministrador();

        console.log(
          "🦋 Acceso de administrador confirmado."
        );

        await cargarProductos();

      } catch (error) {

        console.error(
          "Error de acceso:",
          error
        );


        document.getElementById(
          "products-container"
        ).innerHTML = `

          <div class="error-message">

            ❌ ${error.message}

            <br><br>

            <a
              href="admin.html"
              style="
                color:#743d91;
                font-weight:bold;
              "
            >
              ← Volver al panel
            </a>

          </div>

        `;

      }

    }


    /*
      ============================================================
      INICIAR
